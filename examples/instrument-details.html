<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三种可复用的读数放大</title>
<link rel="stylesheet" href="../shared/lab-kit/typography.css" data-kit-inline>
<link rel="stylesheet" href="../shared/lab-kit/detail-view.css" data-kit-inline>
<style>*{box-sizing:border-box}body{margin:0;background:#e9efed;padding:24px}h1{margin:0 0 8px}p{margin:0 0 16px}main{display:grid;grid-template-columns:1.15fr 1fr .8fr;gap:20px;align-items:start}.sample{background:white;border:1px solid #b5c8bf;border-radius:12px;padding:18px;min-width:0}h2{margin:0 0 8px}.sample svg{display:block;width:100%;height:480px}input{accent-color:#236b5e;width:100%}label{display:block}.sample .face svg{height:390px}.sample .surface{position:relative;min-height:530px}.lab-detail{width:100%!important;max-width:100%;position:relative;left:auto!important;right:auto!important;top:auto!important;box-shadow:none}.sample .lab-detail__viewport svg{height:100%}.sample .lab-detail h2{font-size:20px}.sample .lab-detail__readout{margin:2px 0 6px}.lab-note{margin-top:10px}@media(max-width:1100px){main{grid-template-columns:1fr 1fr}.sample:last-child{grid-column:1/-1}.sample .surface{max-width:320px;margin:auto}}@media(max-width:650px){body{padding:12px}main{grid-template-columns:1fr}.sample:last-child{grid-column:auto}.sample svg{height:450px}}</style></head><body class="lab-kit"><h1>读数放大 · 三种复用方式</h1><p>保持仪器刻度与物理状态一致，按教学任务选择呈现方式。</p><main><section class="sample"><h2>圆形放大镜＋定位连线</h2><div id="cylinder"></div><label>改变液面 <input id="volume" type="range" min="15" max="45" step="1" value="39"></label><p class="lab-note">保留液面弯曲，放大区同时显示相邻主刻度。</p></section><section class="sample"><h2>原面板矩形放大</h2><div class="face" id="face"></div><label>改变拉力 <input id="force" type="range" min="0" max="10" step="0.1" value="0.6"></label><p class="lab-note">红色指示片限于中央槽内，不盖住黑色刻度。</p></section><section class="sample"><h2>可继续缩放的读数窗</h2><div id="panel" class="surface"></div><button id="reopen" type="button">显示读数窗</button><p class="lab-note">沿用现有窗口；数字显隐可按练习或演示任务配置。</p></section></main>
<script src="../shared/lab-kit/svg.js" data-kit-inline></script>
<script src="../shared/lab-kit/detail-view.js" data-kit-inline></script>
<script src="../shared/lab-kit/instrument-details.js" data-kit-inline></script>
<script>(function(){const K=LabKit,$=id=>document.getElementById(id),panel=K.createDetailView({host:$('panel'),title:'测力计读数',width:300,top:0,right:0});function volume(){$('cylinder').innerHTML=K.cylinderWithLens({value:Number($('volume').value)});}function force(){const f=Number($('force').value),reading=K.springReadoutDetail({force:f});$('face').innerHTML=K.cropInstrumentSVG(reading);const first=Math.max(0,Math.min(7,Math.floor(f)-1));panel.setSVG(K.svg.linearScale({value:f}),{viewBox:[0,380+first*135-68,360,520],focus:[180,380+f*135]});panel.setReadout(f.toFixed(2)+' N');panel.setSubtitle('10 N量程 · 每小格0.2 N');}$('volume').oninput=volume;$('force').oninput=force;$('reopen').onclick=()=>panel.show();volume();force();window.instrumentDetails={panel,volume,force};window.addEventListener('pagehide',()=>panel.dispose(),{once:true});})();</script></body></html>

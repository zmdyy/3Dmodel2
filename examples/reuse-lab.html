*{box-sizing:border-box}body{margin:0;background:#e7eeee}header{height:100px;padding:16px 28px;background:#f7f8f2;border-bottom:1px solid #b7cac7;display:flex;justify-content:space-between;align-items:center}h1{margin:0 0 4px}p{margin:0}a{color:#28635c}main{height:calc(100dvh - 100px);min-height:650px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;padding:16px}.stage{position:relative;border:1px solid #adc3be;border-radius:14px;overflow:hidden;min-width:0}canvas{display:block;width:100%;height:100%;touch-action:none}.controls{display:flex;flex-direction:column;gap:12px;overflow:auto}section{background:#f8f9f3;border:1px solid #b9cdc5;border-radius:12px;padding:16px}h2{margin:0 0 10px}.buttons{display:flex;flex-wrap:wrap;gap:8px}button{background:#fffef8;border:1px solid #b2c7be;color:#244d46;border-radius:8px;padding:8px 13px;cursor:pointer}button[aria-pressed=true]{background:#236b5e;color:white;border-color:#236b5e}label{display:block;margin-top:10px}input[type=range]{width:100%;accent-color:#236b5e}.top-tag{position:absolute;left:20px;top:18px;background:#f9fcf3e8;border:1px solid #b3c8c1;padding:10px 15px;border-radius:8px;pointer-events:none;font-size:18px}.hint{position:absolute;left:20px;top:72px;font-size:16px;color:#385852;pointer-events:none}.bottom-tools{position:absolute;bottom:18px;left:18px;right:18px;display:flex;gap:8px;flex-wrap:wrap}.warning{position:absolute;inset:15%;padding:20px;background:#fff5dc}[hidden]{display:none!important}@media(max-width:1100px){header{height:auto;gap:12px;flex-wrap:wrap;padding:14px}main{height:auto;grid-template-columns:1fr;min-height:0}.stage{height:65dvh;min-height:450px}.controls{overflow:visible;display:grid;grid-template-columns:1fr 1fr}}@media(max-width:560px){.controls{display:flex}.hint{max-width:240px}.bottom-tools{gap:5px}.lab-kit button{font-size:16px}}
</style></head><body class="lab-kit"><header><div><h1>同一套器材 · 两种实验配置</h1><p class="lab-note">玻璃容器、支架、测力计、SVG读数与视角控制的复用验证</p></div><a href="../docs/reuse/README.md">查看资源说明</a></header>
<main><div class="stage" id="stage"><canvas id="view" aria-label="可旋转的实验装置"></canvas><div class="top-tag" id="sceneTitle">空气中称量</div><div class="hint">左拖旋转 · 右拖 / Shift 平移<br>滚轮缩放 · 双指平移与缩放</div><div class="bottom-tools"><button id="home">默认视角</button><button id="auto" aria-pressed="false">自动观察</button><button id="cut" aria-pressed="false">打开测力计</button><button id="closeup" aria-pressed="true">读数放大</button></div><div class="warning" id="error" hidden></div></div><div id="detailCompact" hidden></div><aside class="controls"><section><h2>选择实验</h2><div class="buttons"><button data-mode="weigh" aria-pressed="true">空气中称量</button><button data-mode="immerse" aria-pressed="false">浸入液体</button></div><p class="lab-note" id="modeNote">在空气中测量物体重力。</p><label id="lowerLabel" hidden>降低装置 <input id="lower" type="range" min="0" max="0.16" step="0.001" value="0"></label></section><section><h2>观察记录</h2><p id="status">准备就绪</p><p class="lab-note" style="margin-top:10px">通用容器为教学几何；10 N测力计沿用已建结构。此页用于验证资源调用。</p></section></aside></main>
<script src="../shared/vendor/three-r160.min.js" data-kit-inline></script>
<script src="../shared/lab-kit/navigation.js" data-kit-inline></script>
<script src="../shared/lab-kit/svg.js" data-kit-inline></script>
<script src="../shared/lab-kit/glassware.js" data-kit-inline></script>

<script src="../shared/lab-kit/spring-meter.js" data-kit-inline></script>
<script src="../shared/lab-kit/detail-view.js" data-kit-inline></script>
<script>
(async function(){'use strict';const $=id=>document.getElementById(id),T=THREE,K=LabKit;try{
 const renderer=new T.WebGLRenderer({canvas:$('view'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new T.Scene(),camera=new T.PerspectiveCamera(34,1,.002,30),environment=K.createGlassLab(T,{renderer,scene});
 const beaker=K.createBeaker(T,{radius:.055,height:.14,wall:.0018,level:.1}),stand=K.createStand(T,{height:.62,armLength:.2,clampHeight:.53}),meter=K.createSpringMeter(T,{renderer});scene.add(beaker.group,stand.group,meter.group);beaker.group.position.x=.2;
 const floor=new T.Mesh(new T.PlaneGeometry(4,4),new T.MeshStandardMaterial({color:'#c5d1cd',roughness:.88}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
 const massHeight=.06,massRadius=.025,mass=.2,g=9.8,rho=1000,object=new T.Mesh(new T.CylinderGeometry(massRadius,massRadius,massHeight,64),new T.MeshStandardMaterial({color:'#b49b65',roughness:.55,metalness:.65}));object.castShadow=true;scene.add(object);
 const thread=new T.Mesh(new T.CylinderGeometry(.0007,.0007,1,12),new T.MeshStandardMaterial({color:'#40534a',roughness:.8}));scene.add(thread);
 let mode='weigh',lowering=0,cut=false,tour=false,tourTime=0,last=0,frame=0,disposed=false,physics={};
 const detail=K.createDetailView({host:$('stage'),compactHost:$('detailCompact'),title:'测力计读数',subtitle:'10 N量程 · 每小格0.2 N',onVisibilityChange(v){$('closeup').setAttribute('aria-pressed',String(v));}});
 function sync(){const bottom=.18-(mode==='immerse'?lowering:0),area=Math.PI*massRadius**2,containerArea=Math.PI*(.055-2*.0018)**2,submerged=mode==='immerse'?Math.max(0,Math.min(massHeight,(.0018+.1-bottom)/(1-area/containerArea))):0,volume=area*submerged,force=mass*g-rho*g*volume;beaker.setLevel(.1+volume/containerArea);meter.setForce(force);
  const hook=meter.getHookAnchor(),upper=meter.anchors.upperAttachment,rootY=bottom+massHeight+.025-hook[1];stand.setClampHeight(rootY+upper[1]+.01);const mount=stand.getMountAnchor();meter.group.position.set(...mount.map((v,i)=>v-upper[i]));object.position.set(.2,bottom+massHeight/2,0);
  const start=new T.Vector3(meter.group.position.x+hook[0],rootY+hook[1],0),end=new T.Vector3(.2,bottom+massHeight,0),delta=end.clone().sub(start);thread.position.copy(start).add(end).multiplyScalar(.5);thread.scale.y=delta.length();thread.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),delta.normalize());
  const reading=meter.getReadoutDetail();detail.setSVG(reading.svg,{viewBox:reading.viewBox,focus:reading.focus});detail.setReadout(reading.readout);$('status').textContent=mode==='weigh'?'物体悬空，示数等于重力。':`浸入深度 ${(submerged*100).toFixed(1)} cm，浮力 ${(rho*g*volume).toFixed(2)} N。`;physics={force,submerged,volume,level:beaker.level,bottom,mount};
 }
 function setMode(next){if(!['weigh','immerse'].includes(next))throw Error('Unknown experiment');mode=next;lowering=0;$('lower').value=0;$('lowerLabel').hidden=mode!=='immerse';$('sceneTitle').textContent=mode==='weigh'?'空气中称量':'浸入液体 · 观察浮力';$('modeNote').textContent=mode==='weigh'?'在空气中测量物体重力。':'缓慢降低装置，比较浸入前后的示数。';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));sync();}
 function overview(){return K.fitPose({target:[.13,.31,0],size:[.44,.65,.2],yaw:.42,pitch:.16,fov:camera.fov,aspect:camera.aspect});}
 function meterPose(){return K.fitPose({target:[.2,meter.group.position.y+.01,0],size:[.075,.23,.04],yaw:.05,pitch:.015,fov:camera.fov,aspect:camera.aspect,fill:.85});}
 function cupPose(){return K.fitPose({target:[.2,.095,0],size:[.16,.2,.16],yaw:.6,pitch:.32,fov:camera.fov,aspect:camera.aspect});}
 const nav=K.createNavigation({element:$('view'),pose:overview(),fov:camera.fov,minDistance:.04,maxDistance:4,apply(p,eye){camera.position.set(...eye);camera.lookAt(...p.target);},onManual(){tour=false;$('auto').setAttribute('aria-pressed','false');}});
 const shots=[{at:0,pose:overview},{at:.2,pose:meterPose},{at:.38,pose:meterPose},{at:.52,pose:cupPose},{at:.65,pose:cupPose},{at:.83,pose:()=>({...overview(),yaw:-.65})},{at:1,pose:overview}];
 function resize(){const c=$('view');renderer.setSize(c.clientWidth,c.clientHeight,false);camera.aspect=c.clientWidth/Math.max(1,c.clientHeight);camera.updateProjectionMatrix();}const observer=new ResizeObserver(resize);observer.observe($('stage'));resize();sync();nav.setPose(overview());
 $('home').onclick=()=>nav.setPose(overview());$('closeup').onclick=()=>detail.toggle();$('auto').onclick=()=>{tour=!tour;tourTime=0;$('auto').setAttribute('aria-pressed',String(tour));if(tour)nav.follow(overview(),{jump:true});else nav.stop();};$('cut').onclick=()=>{cut=!cut;meter.setCutaway(cut);$('cut').setAttribute('aria-pressed',String(cut));};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('lower').oninput=e=>{lowering=Number(e.target.value);sync();};
 function loop(now){if(disposed)return;const dt=Math.min(.1,Math.max(0,(now-(last||now))/1000));last=now;if(tour){tourTime=Math.min(28,tourTime+dt);nav.follow(K.sampleShots(shots,tourTime/28));}nav.update(dt);if(tour&&tourTime>=28){tour=false;$('auto').setAttribute('aria-pressed','false');}renderer.render(scene,camera);frame=requestAnimationFrame(loop);}
 await meter.ready;window.reuseLab={beaker,stand,meter,detail,scene,camera,renderer,nav,setMode,setLowering(v){if(!Number.isFinite(v)||v<0||v>.16)throw Error('Lowering range: 0–.16 m');lowering=v;$('lower').value=v;sync();},get physics(){return physics;},shots,get mode(){return mode;},get tour(){return tour;},dispose(){if(disposed)return;disposed=true;cancelAnimationFrame(frame);observer.disconnect();nav.dispose();detail.dispose();environment.dispose();beaker.dispose();meter.dispose();stand.dispose();K.disposeObject(object);K.disposeObject(thread);K.disposeObject(floor);renderer.dispose();}};window.addEventListener('pagehide',()=>reuseLab.dispose(),{once:true});frame=requestAnimationFrame(loop);
 }catch(e){$('error').hidden=false;$('error').textContent='资源演示启动失败：'+e.message;console.error(e);}})();
</script></body></html>

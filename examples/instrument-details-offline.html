    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" role="img" aria-label="量筒及圆形液面放大镜">${svg}</svg>`;

Object.assign(K,{springReadoutDetail,cylinderWithLens,cropInstrumentSVG});

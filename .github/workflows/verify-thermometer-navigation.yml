name: Verify thermometer camera navigation
on:
  push:
    branches:
      - verify/thermometer-navigation
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and select runner Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/therm-deps" playwright@1.56.1
          echo "LAB_KIT_NODE_MODULES=$RUNNER_TEMP/therm-deps/node_modules" >> "$GITHUB_ENV"
          echo "LAB_KIT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Verify native pointer gestures in nine views
        run: |
          sha256sum models/thermometers-thermal-expansion.html
          timeout 100s node scripts/tests/thermometer-camera-check.cjs
      - name: Verify reuse registry and shared unit checks
        if: always()
        run: |
          python - <<'PY'
          import hashlib, pathlib, re
          path = pathlib.Path('shared/lab-kit/registry.json')
          source = pathlib.Path('models/thermometers-thermal-expansion.html')
          old = '4b5441941d97b4cdb6559ece7b01c483ce2ac3149f5edd09efebc6af005fc875'
          new = hashlib.sha256(source.read_bytes()).hexdigest()
          content = path.read_text()
          assert content.count(old) == 2
          path.write_text(content.replace(old, new))
          PY
          result=0
          python scripts/reuse-context.py --validate || result=1
          node scripts/tests/lab-kit.cjs || result=1
          exit "$result"

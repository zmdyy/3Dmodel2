name: Prepare source snapshot for standalone offline HTML export
on:
  push:
    branches:
      - export/offline-html-20261111
    paths:
      - .github/workflows/prepare-offline-source.yml
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Package exact repository source
        run: tar -czf /tmp/3Dmodel2-source.tar.gz --exclude=.git -C "$GITHUB_WORKSPACE" .
      - uses: actions/upload-artifact@v4
        with:
          name: repository-source-for-offline-export
          path: /tmp/3Dmodel2-source.tar.gz
          compression-level: 0
          retention-days: 7

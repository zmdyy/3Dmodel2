name: Capture real WebGL crane cover

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-crane-cover.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Serve repository
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/crane-cover-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/models/mobile-crane-simple-machines.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/crane-cover-http.log
          exit 1

      - name: Capture real WebGL scene
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: [
                '--enable-webgl',
                '--ignore-gpu-blocklist',
                '--use-gl=angle',
                '--use-angle=swiftshader',
                '--enable-unsafe-swiftshader'
              ]
            });
            const page = await browser.newPage({
              viewport: { width: 1600, height: 900 },
              deviceScaleFactor: 1
            });
            page.on('console', m => console.log('[browser]', m.type(), m.text()));
            page.on('pageerror', e => console.log('[pageerror]', e.message));

            await page.goto(
              'http://127.0.0.1:8000/models/mobile-crane-simple-machines.html?captureCover=1',
              { waitUntil: 'domcontentloaded', timeout: 120000 }
            );
            await page.waitForTimeout(7000);

            // Use the actual teaching scene's "起重准备" state when that control exists.
            const prep = page.getByText('起重准备', { exact: false }).first();
            if (await prep.count()) {
              try {
                await prep.click({ timeout: 5000 });
                await page.waitForTimeout(4500);
              } catch (e) {
                console.log('Could not click 起重准备:', e.message);
              }
            }

            const canvas = page.locator('canvas').first();
            await canvas.waitFor({ state: 'visible', timeout: 30000 });
            let box = await canvas.boundingBox();
            if (!box || box.width < 300 || box.height < 200) {
              throw new Error('WebGL canvas has invalid size: ' + JSON.stringify(box));
            }

            // Remove page UI from the capture without changing the 3D model itself.
            await page.evaluate(() => {
              const c = document.querySelector('canvas');
              if (!c) return;
              for (const el of document.querySelectorAll('body *')) {
                if (el === c || el.contains(c)) continue;
                el.style.visibility = 'hidden';
              }
            });
            await page.waitForTimeout(500);

            box = await canvas.boundingBox();
            const targetRatio = 16 / 9;
            let w = box.width, h = box.height, x = box.x, y = box.y;
            if (w / h > targetRatio) {
              w = h * targetRatio;
              x = box.x + (box.width - w) / 2;
            } else {
              h = w / targetRatio;
              y = box.y + (box.height - h) / 2;
            }

            fs.mkdirSync('assets/covers', { recursive: true });
            await page.screenshot({
              path: 'assets/covers/mobile-crane-simple-machines-scene.jpg',
              type: 'jpeg',
              quality: 94,
              clip: { x, y, width: w, height: h },
              animations: 'disabled'
            });
            console.log('Captured canvas:', box, 'clip:', { x, y, width: w, height: h });
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Verify cover
        run: |
          test -s assets/covers/mobile-crane-simple-machines-scene.jpg
          file assets/covers/mobile-crane-simple-machines-scene.jpg
          ls -lh assets/covers/mobile-crane-simple-machines-scene.jpg

      - name: Commit real scene cover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/covers/mobile-crane-simple-machines-scene.jpg
          if git diff --cached --quiet; then
            echo "Cover unchanged."
            exit 0
          fi
          git commit -m "fix: replace crane cover with real WebGL scene [skip ci]"
          git push

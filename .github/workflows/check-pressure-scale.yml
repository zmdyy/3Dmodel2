name: Validate pressure-scale 3D exhibit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-pressure-scale.yml'
      - 'scripts/check-pressure-scale.cjs'

permissions:
  contents: write

jobs:
  visual-and-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium and Sharp
        run: |
          npm install --prefix "$RUNNER_TEMP/check-deps" playwright@1.56.1 sharp@0.34.3
          "$RUNNER_TEMP/check-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run actual WebGL rendering and physics tests
        env:
          COVER_NODE_MODULES: ${{ runner.temp }}/check-deps/node_modules
        run: node scripts/check-pressure-scale.cjs
      - name: Verify catalog and cover file
        run: |
          test -s assets/covers/pressure-scale-scene.jpg
          node -e "const fs=require('fs'),vm=require('vm');const ctx={window:{}};vm.runInNewContext(fs.readFileSync('catalog.js','utf8'),ctx);const x=ctx.window.MODEL_CATALOG.find(o=>o.id==='pressure-scale');if(!x?.cover||!fs.existsSync(x.cover.split('?')[0]))process.exit(1)"
          git diff --check
      - name: Publish verified case cover and updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.js assets/covers/pressure-scale-scene.jpg
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "feat(pressure-scale): publish verified scene cover and metadata"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pressure-scale-acceptance
          path: cover-captures/pressure-scale/
          if-no-files-found: ignore

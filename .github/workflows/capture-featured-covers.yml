name: Verify wheel and axle and capture cover
on:
  push:
    branches:
      - verify/wheel-axle-cover
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot dependencies and select runner Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/cover-deps" playwright@1.56.1 sharp@0.34.3
          echo "COVER_NODE_MODULES=$RUNNER_TEMP/cover-deps/node_modules" >> "$GITHUB_ENV"
          echo "LAB_KIT_NODE_MODULES=$RUNNER_TEMP/cover-deps/node_modules" >> "$GITHUB_ENV"
          echo "LAB_KIT_CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
      - name: Verify four cases and capture an actual WebGL frame
        run: node scripts/capture-featured-covers.cjs
      - name: Validate repository reuse
        if: always()
        run: |
          exit_code=0
          python scripts/reuse-context.py --validate || exit_code=1
          node scripts/tests/lab-kit.cjs || exit_code=1
          node scripts/tests/reuse-browser.cjs || exit_code=1
          node scripts/tests/instrument-patterns.cjs || exit_code=1
          exit "$exit_code"

<script>
'use strict';
(()=>{const $=s=>document.querySelector(s),TAU=2*Math.PI,Y=2.45,A=1.6,H=.96,R=.075;
const state={mode:4,fullSide:'left',theta:-25*Math.PI/180,omega:0,running:false,power:true,polarity:1,speed:1,time:0};
const descriptions=['两端绝缘，支架不能接触铜线。电路断开，线圈不受电磁力；轻推后只会逐渐停下。','只刮去一端，另一端仍绝缘。即使裸露端接触支架，电路仍断开。','两端裸露的半面配合：转过一圈，两端同时接通半圈、断开半圈。通电时受力，断电时依靠惯性。','两端始终接触铜线。电流不换向，但线圈转过平衡位置后转矩改变方向，通常摆动后停下。','教材做法：一端始终接通，另一端控制半圈通电、半圈断电。轻推后可在惯性帮助下持续转动。'];
const wrap=a=>((a%TAU)+TAU)%TAU;
function kinds(){if(state.mode===0)return['none','none'];if(state.mode===1)return state.fullSide==='left'?['full','none']:['none','full'];if(state.mode===2)return['half','half'];if(state.mode===3)return['full','full'];return state.fullSide==='left'?['full','half']:['half','full'];}
function halfPhase(){return 0;}
function contact(kind,t=state.theta){return kind==='full'||kind==='half'&&Math.cos(t-halfPhase())>1e-8;}
function connected(t=state.theta){const k=kinds();return state.power&&contact(k[0],t)&&contact(k[1],t);}
function torque(t=state.theta){return connected(t)?2.4*state.polarity*Math.cos(t):0;}
function advance(dt){const steps=Math.max(1,Math.ceil(dt/.003));dt/=steps;for(let i=0;i<steps;i++){state.omega+=(torque()-.38*state.omega)*dt;state.theta+=state.omega*dt;if(Math.abs(state.omega)<.002&&Math.abs(torque())<.002)state.omega=0;}state.time+=dt*steps;}
let renderer;try{renderer=new THREE.WebGLRenderer({canvas:$('#scene'),antialias:true,preserveDrawingBuffer:true});}catch(e){$('#fatal').style.display='flex';$('#fatal').textContent='浏览器未能启用 3D。请使用支持 WebGL 的 Chrome 或 Edge 浏览器打开此文件。';return;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;renderer.shadowMap.enabled=false;renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const mat=(c,m=0,r=.4)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r});const copper=mat('#e9aa62',.35,.43),lacquer=mat('#244456',.10,.55),silver=mat('#b7bec5',.40,.43),gold=mat('#b89a60',.78,.3),red=mat('#e33139',.25,.28),blue=mat('#1661cb',.25,.3),teal=mat('#007f83',.22,.35),dark=mat('#243849',.25,.48);
function mesh(geo,material,parent=scene){const m=new THREE.Mesh(geo,material);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function box(x,y,z,pos,material,parent=scene){let m=mesh(new THREE.BoxGeometry(x,y,z),material,parent);m.position.set(...pos);return m;}
function cyl(radius,length,pos,material,axis='y',parent=scene){const m=mesh(new THREE.CylinderGeometry(radius,radius,length,40),material,parent);if(axis==='x')m.rotation.z=-Math.PI/2;m.position.set(...pos);return m;}
function tube(points,radius,material,parent=scene,steps=80){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)),false,'centripetal');const m=mesh(new THREE.TubeGeometry(curve,steps,radius,8,false),material,parent);return{m,curve};}
const base=box(6.50,.16,3.75,[0,.06,.55],mat('#c1c4c7',.03,.78));
// Battery terminals and both leads form the external series circuit.

App .panel .row button{min-height:37px}.modes{gap:5px}#motorApp .slider-label{margin-top:7px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"app\">\u003cheader>\u003cdiv>\u003ch1>手动换向 · 让线圈连续转动\u003c/h1>\u003cp>先观察摆动，再调换正负极，观察引线缠绕\u003c/p>\u003c/div>\u003cdiv class=\"toolbar\">\u003cbutton id=\"home\">恢复视角\u003c/button>\u003cbutton id=\"export\">导出图片\u003c/button>\u003cbutton id=\"fullscreen\">全屏\u003c/button>\u003c/div>\u003c/header>\u003cmain class=\"layout\">\u003csection class=\"visual\">\u003cdiv class=\"stage\" id=\"stage\">\u003ccanvas id=\"scene\">\u003c/canvas>\u003cdiv class=\"badge\" id=\"badge\">开关断开 · 无电流\u003c/div>\u003cdiv class=\"help\">拖拽旋转 · 滚轮缩放\u003c/div>\u003cdiv id=\"tags\">\u003c/div>\u003cdiv class=\"legend\">\u003cspan>\u003ci style=\"background:#e33139\">\u003c/i>电流 I\u003c/span>\u003cspan>\u003ci style=\"background:#1661cb\">\u003c/i>受力 F\u003c/span>\u003cspan>\u003ci style=\"background:#007f83\">\u003c/i>磁感线 B\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"summaries\">\u003cdiv class=\"summary\">\u003csmall>线圈的运动\u003c/small>\u003cstrong id=\"motion\">静止 · 尚未通电\u003c/strong>\u003c/div>\u003cdiv class=\"summary\">\u003csmall id=\"secondLabel\">引线扭转\u003c/small>\u003cstrong id=\"secondValue\">0 圈\u003c/strong>\u003cdiv class=\"turnbar\" id=\"turnbar\">\u003ci id=\"turnfill\">\u003c/i>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003caside class=\"panel\">\u003cp class=\"label\">实验操作\u003c/p>\u003cdiv class=\"row\">\u003cbutton id=\"play\" class=\"primary\">开始演示\u003c/button>\u003cbutton id=\"reset\">复位实验\u003c/button>\u003c/div>\u003cdiv class=\"row\">\u003cbutton id=\"power\">闭合开关\u003c/button>\u003cbutton id=\"reverse\">调换正负极\u003c/button>\u003c/div>\u003cdiv class=\"actions\" id=\"commActions\">\u003cbutton id=\"focus\">放大换向器\u003c/button>\u003c/div>\u003cdiv class=\"phase-wheel\">\u003ccanvas id=\"wheel\" width=\"240\" height=\"240\">\u003c/canvas>\u003cdiv>\u003cstrong id=\"angleValue\">335°\u003c/strong>\u003cspan>90°、270°为平衡位置\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"slider-label\">\u003cspan>线圈位置\u003c/span>\u003cspan class=\"angle-number\" id=\"sliderAngle\">0°\u003c/span>\u003c/div>\u003cinput id=\"angle\" type=\"range\" min=\"0\" max=\"359\" step=\"1\" value=\"335\" aria-label=\"手动调整线圈位置\">\u003cdiv class=\"slider-label\">\u003cspan>演示速度\u003c/span>\u003cspan id=\"speedValue\">0.7×\u003c/span>\u003c/div>\u003cinput id=\"speed\" type=\"range\" min=\"0.2\" max=\"1.5\" step=\"0.1\" value=\"0.7\" aria-label=\"演示速度\">\u003cdiv class=\"checks\">\u003clabel>\u003cinput id=\"showI\" type=\"checkbox\" checked>电流箭头\u003c/label>\u003clabel>\u003cinput id=\"showF\" type=\"checkbox\" checked>受力箭头\u003c/label>\u003clabel>\u003cinput id=\"showB\" type=\"checkbox\" checked>磁感线\u003c/label>\u003clabel>\u003cinput id=\"showLabels\" type=\"checkbox\" checked>器材标注\u003c/label>\u003c/div>\u003cdiv class=\"readout\">\u003cstrong id=\"phase\">开关断开\u003c/strong>\u003cp id=\"guidance\">闭合开关，观察线圈的运动。\u003c/p>\u003c/div>\u003cp class=\"bottom-note\" id=\"note\">\u003c/p>\u003c/aside>\u003c/main>\u003c/div>\n\u003cscript>\n'use strict';const THREE=parent.THREE;\n(()=>{const MODE='manual',comm=MODE==='comm',$=q=>document.querySelector(q),TAU=2*Math.PI,Y=2.05,A=1.23,Z=1.02,initial=0,limit=3*TAU,splitHalfGap=.15,contactGap=splitHalfGap-Math.asin(.014/.44);\nconst s={theta:initial,omega:0,source:1,power:comm,running:false,speed:comm?.3:.7,time:0,start:initial,swaps:0,brushSide:1,coilCurrent:0,turns:0,wireLimit:false};let active=false;\nconst wrap=a=>((a%TAU)+TAU)%TAU;\nfunction current(){if(!s.power)return 0;if(comm){if(Math.abs(Math.cos(s.theta))\u003cMath.sin(contactGap))return 0;return s.source*Math.sign(Math.cos(s.theta));}return s.source;}\nfunction torque(){return 2.4*current()*Math.cos(s.theta);}\nfunction advance(seconds){const steps=Math.max(1,Math.ceil(seconds/.003));const dt=seconds/steps;for(let n=0;n\u003csteps;n++){s.omega+=(torque()-.5*s.omega)*dt;s.theta+=s.omega*dt;if(!comm&&Mat ackground:#1661cb\">\u003c/i>受力 F\u003c/span>\u003cspan>\u003ci style=\"background:#007f83\">\u003c/i>磁感线 B\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"summaries\">\u003cdiv class=\"summary\">\u003csmall>线圈的运动\u003c/small>\u003cstrong id=\"motion\">静止 · 尚未通电\u003c/strong>\u003c/div>\u003cdiv class=\"summary\">\u003csmall id=\"secondLabel\">引线扭转\u003c/small>\u003cstrong id=\"secondValue\">0 圈\u003c/strong>\u003cdiv class=\"turnbar\" id=\"turnbar\">\u003ci id=\"turnfill\">\u003c/i>\u003c/div>\u003c/div>\u003c/div>\u003c/section>\u003caside class=\"panel\">\u003cp class=\"label\">实验操作\u003c/p>\u003cdiv class=\"row\">\u003cbutton id=\"play\" class=\"primary\">开始演示\u003c/button>\u003cbutton id=\"reset\">复位实验\u003c/button>\u003c/div>\u003cdiv class=\"row\">\u003cbutton id=\"power\">闭合开关\u003c/button>\u003cbutton id=\"reverse\">调换正负极\u003c/button>\u003c/div>\u003cdiv class=\"actions\" id=\"commActions\">\u003cbutton id=\"focus\">放大换向器\u003c/button>\u003c/div>\u003cdiv class=\"phase-wheel\">\u003ccanvas id=\"wheel\" width=\"240\" height=\"240\">\u003c/canvas>\u003cdiv>\u003cstrong id=\"angleValue\">335°\u003c/strong>\u003cspan>90°、270°为平衡位置\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"slider-label\">\u003cspan>线圈位置\u003c/span>\u003cspan class=\"angle-number\" id=\"sliderAngle\">0°\u003c/span>\u003c/div>\u003cinput id=\"angle\" type=\"range\" min=\"0\" max=\"359\" step=\"1\" value=\"335\" aria-label=\"手动调整线圈位置\">\u003cdiv class=\"slider-label\">\u003cspan>演示速度\u003c/span>\u003cspan id=\"speedValue\">0.7×\u003c/span>\u003c/div>\u003cinput id=\"speed\" type=\"range\" min=\"0.2\" max=\"1.5\" step=\"0.1\" value=\"0.7\" aria-label=\"演示速度\">\u003cdiv class=\"checks\">\u003clabel>\u003cinput id=\"showI\" type=\"checkbox\" checked>电流箭头\u003c/label>\u003clabel>\u003cinput id=\"showF\" type=\"checkbox\" checked>受力箭头\u003c/label>\u003clabel>\u003cinput id=\"showB\" type=\"checkbox\" checked>磁感线\u003c/label>\u003clabel>\u003cinput id=\"showLabels\" type=\"checkbox\" checked>器材标注\u003c/label>\u003c/div>\u003cdiv class=\"readout\">\u003cstrong id=\"phase\">开关断开\u003c/strong>\u003cp id=\"guidance\">闭合开关，观察线圈的运动。\u003c/p>\u003c/div>\u003cp class=\"bottom-note\" id=\"note\">\u003c/p>\u003c/aside>\u003c/main>\u003c/div>\n\u003cscript>\n'use strict';const THREE=parent.THREE;\n(()=>{const MODE='comm',comm=MODE==='comm',$=q=>document.querySelector(q),TAU=2*Math.PI,Y=2.05,A=1.23,Z=1.02,initial=0,limit=3*TAU,splitHalfGap=.15,contactGap=splitHalfGap-Math.asin(.014/.44);\nconst s={theta:initial,omega:0,source:1,power:comm,running:false,speed:comm?.3:.7,time:0,start:initial,swaps:0,brushSide:1,coilCurrent:0,turns:0,wireLimit:false};let active=false;\nconst wrap=a=>((a%TAU)+TAU)%TAU;\nfunction current(){if(!s.power)return 0;if(comm){if(Math.abs(Math.cos(s.theta))\u003cMath.sin(contactGap))return 0;return s.source*Math.sign(Math.cos(s.theta));}return s.source;}\nfunction torque(){return 2.4*current()*Math.cos(s.theta);}\nfunction advance(seconds){const steps=Math.max(1,Math.ceil(seconds/.003));const dt=seconds/steps;for(let n=0;n\u003csteps;n++){s.omega+=(torque()-.5*s.omega)*dt;s.theta+=s.omega*dt;if(!comm&&Math.abs(s.theta-s.start)>limit){s.theta=s.start+Math.sign(s.theta-s.start)*limit;s.omega=0;s.wireLimit=true;}if(!comm&&s.wireLimit&&Math.sign(torque())!==Math.sign(s.theta-s.start))s.wireLimit=false;const segment=Math.sign(Math.cos(s.theta));if(comm&&segment&&segment!==s.brushSide){s.swaps++;s.brushSide=segment;}if(Math.abs(s.omega)\u003c.003&&Math.abs(torque())\u003c.008)s.omega=0;}s.time+=seconds;s.coilCurrent=current();s.turns=Math.abs(s.theta-s.start)/TAU;}\nconst renderer=new THREE.WebGLRenderer({canvas:$('#scene'),antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;renderer.shadowMap.enabled=false;renderer.shadowMap.type=THREE.PCFSoftShadowMap;\nconst scene=new THREE. indices.push(k+a,k+b,k+4+a,k+b,k+4+b,k+4+a);}}indices.push(0,2,1,0,3,2);const k=240*4;indices.push(k,k+1,k+2,k,k+2,k+3);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setIndex(indices);g.computeVertexNormals();return g;}\nconst coilMat=mat('#aeb4b9',.45,.34);coilMat.flatShading=true;const coil={curve,m:mesh(bandGeometry(curve),coilMat,rotor)};rotor.add(new THREE.LineSegments(new THREE.EdgesGeometry(coil.m.geometry,35),new THREE.LineBasicMaterial({color:'#667079',transparent:true,opacity:.42})));\nconst externalHardware=new THREE.Group();scene.add(externalHardware);const externalPos=pos=>[comm?pos[0]*.53:pos[0],pos[1],pos[2]],boxExternal=(a,b,c,pos,m)=>box(a,b,c,externalPos(pos),m,externalHardware),cylExternal=(r,l,pos,m)=>cyl(r,l,externalPos(pos),m,'y',externalHardware);\nconst supply=boxExternal(1.3,.78,.78,[2.37,.64,2.43],mat('#8f9eaf',.12,.55));boxExternal(1.37,.075,.85,[2.37,1.07,2.43],silver);boxExternal(1.29,.27,.014,[2.37,.84,2.826],mat('#f5f7f9',0,.8));for(const x of[1.94,2.80])cylExternal(.07,.22,[x,1.20,2.43],x>2.4?redPole:dark);for(const x of[1.90,2.85])for(const z of[2.16,2.7])boxExternal(.14,.12,.14,[x,.20,z],dark);\nboxExternal(1.16,.20,.64,[-2.25,.25,2.43],silver);for(const x of[-2.67,-1.83])cylExternal(.08,.24,[x,.48,2.43],redPole);const blade=boxExternal(comm?.4664:.88,.07,.13,[-2.25,.64,2.43],silver),handle=boxExternal(.2,.16,.28,[-2.59,.7,2.43],dark);\nconst tipX=comm?.64:.30,tipZ=comm?1.72:1.97;\nconst positive=tubing(comm?[[1.484,1.27,2.43],[1.60,1.50,2.2],[1.0,Y-.06,1.85],[tipX,Y,tipZ]]:[[2.8,1.27,2.43],[2.67,1.7,2.13],[1.1,Y,2.14],[tipX,Y,tipZ]],.042,wireRed);\nconst toSwitch=tubing(comm?[[-tipX,Y,tipZ],[-1.0,1.8,1.95],[-.92,.9,2.60],[-.9699,.62,2.43]]:[[-tipX,Y,tipZ],[-.9,1.62,2.23],[-1.75,.9,2.60],[-1.83,.62,2.43]],.042,wireBlue);\nconst toNegative=tubing(comm?[[-1.4151,.62,2.43],[-1.5,.45,2.98],[-.3,.37,3.03],[.45,.40,3.03],[.50,1.30,2.63],[1.0282,1.36,2.43],[1.0282,1.27,2.43]]:

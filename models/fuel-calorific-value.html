/* Layout revision: graph lives beside the apparatus, within the stage. */
#view{width:59%;right:auto}

/* Reused circular thermometer magnifier from the water boiling laboratory. */
.float-mag{position:absolute;top:50px;width:min(18%,190px);aspect-ratio:370/365;border-radius:50%;background:transparent;z-index:5;filter:drop-shadow(0 5px 10px #344c5c38)}
.float-mag[hidden]{display:none}
.mag-0{left:calc(69% - min(9%,95px))}.mag-1{left:calc(88% - min(9%,95px))}
.magnifier-circle{display:block;width:100%;height:auto}
.float-mag .mag-close{position:absolute;right:3px;top:3px;width:24px;height:24px;padding:0;border-radius:50%;font:17px/22px Arial;background:#fffef9e8;border:1px solid #c9d4d9;color:#596970;z-index:2}
.mag-caption{position:absolute;top:7px;left:7px;font-size:11px;font-weight:700;padding:3px 6px;border:1px solid #d7e1e4;border-radius:9px;background:#fffef9eb;color:var(--blue);z-index:1}.mag-1 .mag-caption{color:var(--orange)}
.mag-leader{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;overflow:hidden}.mag-leader path{fill:none;stroke:#79919f;stroke-width:1.5;stroke-dasharray:4 4;opacity:.75}.mag-leader circle{fill:#fff;stroke:#6d8b9d;stroke-width:1.5}
.zoom-controls{display:flex;gap:8px;flex-wrap:wrap}.zoom-controls button{font-size:12px;padding:8px 10px}

@media(max-width:650px){.float-mag{top:130px;width:135px}.mag-0{left:8px;right:auto}.mag-1{right:8px}.mag-leader{display:none}.mag-caption{font-size:10px}.float-mag .mag-close{width:22px;height:22px}}

<header><div><small>PHYSICS · INQUIRY LAB</small><h1>不同燃料的热值 · 双灯探究实验</h1></div><span class="badge">观察 · 记录 · 再试一次</span></header>
<main><section class="left"><div class="stage"><div id="view"><svg id="thermScales" aria-label="两支温度计的矢量刻度"></svg></div><svg class="mag-leader" id="magLeader" aria-hidden="true"><path id="magLine0"/><circle id="magAnchor0" r="4"/><path id="magLine1"/><circle id="magAnchor1" r="4"/></svg><div class="float-mag mag-0" id="mag0"><span class="mag-caption" id="magCaption0"></span><button class="mag-close" id="magClose0" title="关闭该组温度计放大">×</button><div id="magContent0"></div></div><div class="float-mag mag-1" id="mag1"><span class="mag-caption" id="magCaption1"></span><button class="mag-close" id="magClose1" title="关闭该组温度计放大">×</button><div id="magContent1"></div></div><div id="error"></div><div class="stage-top"><b>相同装置，换一种燃料</b><p>两杯均装水 · 酒精 / 煤油</p><div class="scene-zoom-controls"><button id="zoomToggle0">隐藏酒精组放大</button><button id="zoomToggle1">隐藏煤油组放大</button></div></div><div class="viewtools"><button id="home">默认视角</button><button id="front">正面</button><button id="glass">隐藏杯壁</button></div><div class="labels" id="labels"></div><div class="stage-hint">左键旋转 · 右键或 Shift＋左键平移 · 滚轮缩放 · 双击复位</div><div class="panel chartbox"><div class="charttitle"><h2>温度—时间图像</h2><div class="legend"><span><i class="dot"></i>酒精组</span><span><i class="dot o"></i>煤油组</span><button id="prev">显示上轮曲线</button></div></div><svg id="chart" viewBox="0 0 900 240" role="img" aria-label="两组水温随时间变化图像"></svg></div></div>
</section><aside><section class="panel"><h2>实验设置</h2><label class="param"><span>每杯水的质量</span><span class="inputbox"><input id="water" type="number" min="50" max="400" step="10" value="200"><small>g</small></span></label><label class="param"><span>两杯水的初温</span><span class="inputbox"><input id="initial" type="number" min="5" max="95" step="5" value="20"><small>℃</small></span></label><label class="param"><span>各消耗燃料质量</span><span class="inputbox"><input id="fuel" type="number" min="0.1" max="30" step="0.5" value="2"><small>g</small></span></label><p class="sub">两灯初始各装 40.0 g 燃料；达到设定消耗质量后盖帽熄火。</p><div class="run"><button id="play" class="primary">点燃两灯</button><button id="reset">重新试验</button></div><div class="param"><span>演示速度</span><select id="speed"><option value="1">1×</option><option value="5">5×</option><option value="10" selected>10×</option><option value="30">30×</option></select></div></section>
<section class="panel"><div class="status"><span id="status">准备实验</span><span><b class="time" id="clock">0</b> s</span></div><div id="data"></div></section>

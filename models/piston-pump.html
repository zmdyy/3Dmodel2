<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手压抽水机 · 自由探究</title><link rel="stylesheet" href="../shared/piston-pump.css?v=20261018-ui1"><script type="importmap">{"imports":{"three":"../shared/vendor/three-r165/three.module.js","three/addons/":"../shared/vendor/three-r165/addons/"}}</script></head><body>
<header><div class="brand"><small>OBSERVE · OPERATE · EXPLAIN</small><h1>手压抽水机</h1></div><div class="modes" aria-label="装置初始状态"><button data-mode="dry" class="active">空筒启动</button><button data-mode="wet">已灌水抽水</button></div><button id="info">资料与说明</button></header>
<main><section class="workspace"><div id="view"><div class="view-title"><span>自由操作 · 随时选择问题</span><strong id="stage">正在载入精细模型…</strong></div><div class="view-tools"><button data-view="all">整体</button><button data-view="piston">近看活塞</button><button data-view="valve">近看底阀</button><button id="cut" class="active">半剖</button></div><div id="labels"></div><div id="pressure" hidden><div class="pressure-title">泵腔压强 <small>定性</small></div><div class="pressure-track"><span>高</span><div class="rail"><i id="pressureFill"></i><b class="reference"></b></div><span>低</span><label>大气压参考</label></div></div><div class="legend"><span class="air-dot"></span>空气 <span class="water-dot"></span>水流 <span class="drag-hint">拖动旋转 · 滚轮缩放</span></div><div class="motion"><span id="direction">把手待操作</span><strong id="count">0 次按压</strong></div><div id="loading">正在加载本地 Blender 精细模型</div><div id="error" hidden></div></div></section>
<aside><section class="questions"><div class="eyebrow">探究问题</div><button data-question="0" class="question active">为什么加水后才能顺利抽水？</button><button data-question="1" class="question">反复按压，水怎样被送到出口？</button><div class="prompt"><p id="questionPrompt">比较加水前后的空气流动、引水下渗和进水现象。</p><button id="explain" class="text-button">查看原理解释 ↗</button></div></section>
<section class="operate"><div class="section-heading"><h2>动手试一试</h2><span id="operationHint">先试着按压，再加入引水</span></div><div class="operation-grid"><button id="once" class="primary">按压一次</button><button id="run">连续按压</button><button id="prime" class="prime">加入引水</button><button id="reset">复位</button></div><div class="speed"><label for="speed">观察速度</label><div><button data-speed="1" class="active">正常</button><button data-speed="0.5">慢放</button><button id="step" title="向前推进一小步">逐步</button></div></div></section>
<section class="display"><h2>显示内容</h2><div class="toggles"><label><input type="checkbox" id="air" checked><span>空气流动</span></label><label><input type="checkbox" id="water" checked><span>水流方向</span></label><label><input type="checkbox" id="pressureToggle"><span>压强指示</span></label><label><input type="checkbox" id="names"><span>零件名称</span></label></div></section><p class="scope">自由选择问题，装置状态保持不变。流向、渗漏和压强变化为定性示意。</p></aside></main>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭">关闭</button></div><div id="dialogBody"></div></dialog><script type="module" src="../shared/piston-pump.js?v=20261018-ui1"></script></body></html>

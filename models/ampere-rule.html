const canvas=renderer.domElement,pointers=new Map();canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch)distance=THREE.MathUtils.clamp(distance*pinch/d,9,30);pinch=d;}else if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.pan){const right=V(1,0,0).applyQuaternion(camera.quaternion),up=V(0,1,0).applyQuaternion(camera.quaternion);target.addScaledVector(right,-dx*distance/stage.clientHeight*.65).addScaledVector(up,dy*distance/stage.clientHeight*.65);}else{yaw-=dx*.007;pitch=THREE.MathUtils.clamp(pitch+dy*.007,-1.35,1.35);}drag.x=e.clientX;drag.y=e.clientY;}setCamera();});function endPointer(e){pointers.delete(e.pointerId);pinch=null;if(pointers.size){const p=[...pointers.values()][0];drag={...p,pan:false};}else drag=null;}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('wheel',e=>{e.preventDefault();distance=THREE.MathUtils.clamp(distance*Math.exp(e.deltaY*.001),9,30);setCamera();},{passive:false});
function syncPolarity(){hand.rotation.y=polarity===1?0:Math.PI;poleLeft.textContent=polarity===1?'S':'N';poleRight.textContent=polarity===1?'N':'S';poleLeft.className='label pole '+(polarity===1?'s':'n');poleRight.className='label pole '+(polarity===1?'n':'s');$('leadLeft').textContent=polarity===1?'I ↑':'I ↓';$('leadRight').textContent=polarity===1?'I ↓':'I ↑';$('thumbLabel').textContent=polarity===1?'拇指 → N 极':'N 极 ← 拇指';$('result').textContent=polarity===1?'拇指向右，右端为 N 极。':'拇指向左，左端为 N 极。';$('directionBadge').innerHTML='电流方向：<strong>'+(polarity===1?'正向':'反向')+'</strong>';$('leftReadout').textContent='左端 '+(polarity===1?'S':'N')+' 极';$('rightReadout').textContent='右端 '+(polarity===1?'N':'S')+' 极';$('leftReadout').style.color=polarity===1?'#2876b9':'#d94b4a';$('rightReadout').style.color=polarity===1?'#d94b4a':'#2876b9';leftLeadArrow.position.y=polarity===1?-2.22:-1.6;leftLeadArrow.quaternion.setFromUnitVectors(V(0,1,0),V(0,polarity,0));rightLeadArrow.position.y=polarity===1?-1.6:-2.22;rightLeadArrow.quaternion.setFromUnitVectors(V(0,1,0),V(0,-polarity,0));for(const item of fieldArrows)item.arrow.quaternion.setFromUnitVectors(V(0,1,0),item.curve.getTangentAt(item.t).multiplyScalar(polarity));axisB.position.x=polarity===1?-2.8:2.8;axisB.quaternion.setFromUnitVectors(V(0,1,0),V(polarity,0,0));}
$('reverse').onclick=()=>{polarity*=-1;syncPolarity();};$('handToggle').onchange=e=>hand.visible=e.target.checked;$('currentToggle').onchange=e=>currentGroup.visible=e.target.checked;$('fieldToggle').onchange=e=>field.visible=e.target.checked;$('labelToggle').onchange=e=>labelsOn=e.target.checked;$('rotateToggle').onchange=e=>autoRotate=e.target.checked;
function opacity(v){$('opacityValue').textContent=v+'%';for(const m of handMaterials){m.opacity=v/100;m.transparent=v<100;m.depthWrite=v===100;m.needsUpdate=true;}}
$('opacity').oninput=e=>opacity(+e.target.value);$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续电流':'暂停电流';};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen();}catch(e){$('fullscreen').textContent='浏览器不支持';}};document.addEventListener('fullscreenchange',resize);
$('reset').onclick=()=>{polarity=1;flowTime=0;paused=false;autoRotate=false;labelsOn=true;hand.visible=true;currentGroup.visible=true;field.visible=false;for(const id of ['handToggle','currentToggle','labelToggle'])$(id).checked=true;for(const id of ['fieldToggle','rotateToggle'])$(id).checked=false;$('opacity').value=100;opacity(100);$('pause').textContent='暂停电流';syncPolarity();view('three');};
$('export').onclick=()=>{renderer.render(scene,camera);const c=document.createElement('canvas');c.width=renderer.domElement.width;c.height=renderer.domElement.height;const ctx=c.getContext('2d');ctx.fillStyle='#f3f7fa';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(renderer.domElement,0,0);const scale=c.width/stage.clientWidth;ctx.font='bold '+(27*scale)+'px Microsoft YaHei, sans-serif';ctx.fillStyle='#18334d';ctx.fillText('安培定则 · 右手握螺线管',24*scale,44*scale);for(const el of stage.querySelectorAll('.label')){if(el.style.display==='none')continue;ctx.fillStyle=getComputedStyle(el).color;ctx.font='bold '+(parseFloat(getComputedStyle(el).fontSize)*scale)+'px Microsoft YaHei, sans-serif';ctx.textAlign='center';ctx.fillText(el.textContent,parseFloat(el.style.left)*scale,(parseFloat(el.style.top)+7)*scale);}const a=document.createElement('a');a.download='安培定则_3D观察.png';a.href=c.toDataURL('image/png');a.click();};
function screenLabel(el,point,visible=true){const p=point.clone().project(camera),inside=p.z>-1&&p.z<1&&Math.abs(p.x)<1.1&&Math.abs(p.y)<1.1;el.style.display=labelsOn&&visible&&inside?'block':'none';el.style.left=(p.x*.5+.5)*stage.clientWidth+'px';el.style.top=(-p.y*.5+.5)*stage.clientHeight+'px';}
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(!paused)flowTime+=dt*CurrentFlowStyle.speed/helix.getLength()*polarity;if(autoRotate&&!drag){yaw+=dt*.20;setCamera();}for(let i=0;i<currentArrows.length;i++){const t=((i/currentArrows.length+flowTime)%1+1)%1,p=helix.getPoint(t),dir=helix.getTangent(t).multiplyScalar(polarity);p.y*=1.115;p.z*=1.115;currentArrows[i].position.copy(p);currentArrows[i].quaternion.setFromUnitVectors(V(0,1,0),dir.normalize());}model.updateMatrixWorld(true);const endView=Math.abs(Math.cos(yaw))<.24;screenLabel(poleLeft,V(-3.75,1.05,0),!endView||Math.sin(yaw)<0);screenLabel(poleRight,V(3.75,1.05,0),!endView||Math.sin(yaw)>0);screenLabel($('leadLeft'),V(-4.05,-2,.5),currentGroup.visible);screenLabel($('leadRight'),V(4.05,-2,.5),currentGroup.visible);screenLabel($('thumbLabel'),hand.localToWorld(V(3.0,2.2,-1.8)),hand.visible&&!endView);screenLabel($('fingerLabel'),hand.localToWorld(V(-.5,2.95,.3)),hand.visible&&!endView);renderer.render(scene,camera);}
syncPolarity();view('three');resize();animate();
// Read-only state for local validation and future integration.
window.ampereDemo={scene,camera,renderer,model,hand,handAnatomy,helix,field,getState:()=>({polarity,paused,handVisible:hand.visible,currentVisible:currentGroup.visible,fieldVisible:field.visible,threeVersion:THREE.REVISION})};

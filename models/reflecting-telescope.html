<script>(()=>{'use strict';
const get=id=>document.getElementById(id),stage=get('stage'),canvas=get('three'),rayCanvas=get('rays'),notice=get('notice');
const gl=canvas.getContext('webgl2',{alpha:true,antialias:true,premultipliedAlpha:false,depth:true})||canvas.getContext('webgl',{alpha:true,antialias:true,premultipliedAlpha:false,depth:true});
if(!gl){notice.style.display='block';notice.textContent='无法启动 WebGL，请在 Chrome / Edge 中开启图形加速。';return;}
const overlay=rayCanvas.getContext('2d'),inset=get('insetImage').getContext('2d'),profile=get('profileCanvas').getContext('2d');
const vs=`attribute vec3 aPos;attribute vec3 aNormal;
uniform mat4 uVP;uniform vec3 uOffset;uniform float uWheelAngle;uniform float uWheelFlag;uniform float uImageScale;uniform float uImageFlag;
varying vec3 vN;varying vec3 vWorld;varying vec3 vLocal;
void main(){vec3 p=aPos;vec3 n=aNormal;
if(uWheelFlag>.5){float c=cos(uWheelAngle),s=sin(uWheelAngle);vec2 v=p.xy-vec2(-0.33,1.75);p.xy=vec2(-0.33+c*v.x-s*v.y,1.75+s*v.x+c*v.y);n.xy=vec2(c*n.x-s*n.y,s*n.x+c*n.y);}
if(uImageFlag>.5){p.x=-.66+(p.x+.66)*uImageScale;p.z*=uImageScale;}p+=uOffset;vN=n;vWorld=p;vLocal=aPos;gl_Position=uVP*vec4(p,1.0);}
`;
const fs=`
precision highp float;
varying vec3 vN;
varying vec3 vWorld;
varying vec3 vLocal;
uniform vec3 uCamera;
uniform vec3 uColor;
uniform float uMetal;
uniform float uRough;
uniform float uAlpha;
uniform float uGlass;
uniform float uCoat;
uniform float uDetail;
uniform float uWear;
uniform float uPatina;
uniform float uBrushed;
uniform float uPrimary;
uniform float uOpticalMirror;
uniform samplerCube uEnvSharp;
uniform samplerCube uEnvSoft;
const float PI=3.14159265359;
vec3 filmic(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.0,1.0);}
float Dggx(float nh,float r){float a=r*r;float a2=a*a;float den=nh*nh*(a2-1.0)+1.0;return a2/(PI*den*den+0.00004);}
float hash3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float Gs(float nv,float k){return nv/(nv*(1.0-k)+k+0.00001);}
vec3 fresnel(vec3 f0,float vdoth){return f0+(1.0-f0)*pow(1.0-clamp(vdoth,0.0,1.0),5.0);}
// Studio softbox reflection: projected on the mirrored environment direction,
// not painted on the optical surface. It moves naturally as the model rotates.
float studioPanel(vec3 R,vec3 direction,float halfWidth,float halfHeight){
  vec3 D=normalize(direction),U=normalize(cross(vec3(0.0,1.0,0.0),D)),W=normalize(cross(D,U));
  float forward=dot(R,D);
  if(forward<=0.0)return 0.0;
  vec2 uv=vec2(dot(R,U),dot(R,W))/max(forward,.06);
  float a=1.0-smoothstep(halfWidth-.012,halfWidth+.012,abs(uv.x));
  float b=1.0-smoothstep(halfHeight-.018,halfHeight+.018,abs(uv.y));
  return a*b;
}
vec3 directLight(vec3 N,vec3 V,vec3 L,vec3 base,vec3 f0,float metal,float rough,vec3 strength){
  vec3 H=normalize(V+L);
  float nl=max(dot(N,L),0.0), nv=max(dot(N,V),0.05);
  float nh=max(dot(N,H),0.0), vh=max(dot(V,H),0.0);
  float k=pow(rough+1.0,2.0)*0.125;
  vec3 F=fresnel(f0,vh);
  vec3 spec=Dggx(nh,rough)*Gs(nv,k)*Gs(nl,k)*F/(4.0*nl*nv+0.001);
  vec3 diff=(1.0-F)*(1.0-metal)*base/PI;
  return (diff+spec)*strength*nl;
}
void main(){
  vec3 N=normalize(vN),V=normalize(uCamera-vWorld);
  if(dot(N,V)<0.0)N=-N;
  float nv=max(0.04,dot(N,V));
  // Optical mirrors are front-surface reflective coatings: no painted diffuse layer,
  // no brushed-metal grain, and no dark powder-coat roughness.
  // The specular scene is sampled in reflection direction, so highlights slide when the
  // viewer rotates around the instrument and curved primary has spatially changing highlights.
  if(uOpticalMirror>.5){
    vec3 R=reflect(-V,N);
    vec3 sharp=textureCube(uEnvSharp,R).rgb;
    vec3 soft=textureCube(uEnvSoft,R).rgb;
    // A neutral silver coating reflecting a dark optical lab and its bright softboxes.
    // Slight blue tint comes from the environment, not colored mirror paint.
    // Dark laboratory reflections with deliberately limited (not overexposed) silver highlights.
    vec3 scene=sharp*.48+soft*.09+vec3(.025,.040,.060);
    // A pair of large, rectangular studio lights are seen only in mirror reflection.
    // Primary sees the forward-left panel; secondary sees the elevated side panel.
    float stripA=studioPanel(R,vec3(-.80,-.18,-.57),.36,.025);
    float stripB=studioPanel(R,vec3(.23,.85,-.46),.10,.054);
    float broad=studioPanel(R,vec3(-.93,.12,-.37),.22,.085);
    scene+=vec3(.54,.60,.69)*stripA;
    scene+=vec3(.56,.62,.70)*stripB;
    scene+=vec3(.25,.33,.41)*broad;
    float rimF=pow(1.0-nv,5.0);
    scene*=mix(vec3(.97,.99,1.02),vec3(1.05,1.10,1.15),rimF);
    vec3 silver=pow(filmic(scene*1.18),vec3(.4545));
    gl_FragColor=vec4(silver,1.0);
    return;
  }
  float metal=clamp(uMetal,0.0,1.0);
  vec3 base=uColor;
  // Spatially stable procedural wear: this texture follows the component,
  // not the camera or the lighting; no downloaded images or extra triangles.
  float grain=hash3(floor(vLocal*67.0));
  float large=hash3(floor(vLocal*7.5));
  float waves=sin(vLocal.x*19.0+2.4*sin(vLocal.z*13.0))*sin(vLocal.y*17.0+vLocal.z*9.0);
  float wear=uWear;
  float patina=uPatina;
  float brushed=uBrushed;
  // Fine casting texture / shallow orange-peel paint. Preserve readability at a distance.
  float fine=0.5*grain+0.5*(0.5+0.5*waves);
  base*=1.0-(0.028+0.075*wear)*(fine-.36);
  if(wear>.001){
    // Uneven old paint, light road dust and tiny dark scuffs; not fake rust patches.
    float haze=0.64*large+0.36*max(0.0,waves);
    base*=1.0-wear*(.11+.18*haze);
    // Rare, thin axial scratches on barrel surface, exposing grey undercoat.
    float phi=atan(vLocal.z,vLocal.y-.86);
    float stripe=abs(sin(phi*87.0+vLocal.x*.83));
    float scratch=(1.0-smoothstep(.995,1.0,stripe)) * 0.0;
    scratch=smoothstep(.9985,.9997,stripe);
    float patch=hash3(floor(vec3(vLocal.x*3.0,phi*8.0,2.0)));
    float mask=smoothstep(.84,.995,patch)*scratch;
    base=mix(base,vec3(.20,.22,.23),mask*.36*wear);
  }
  if(patina>.001){
    // Oxidized recesses and quiet tarnish of unpolished brass / steel.
    float tarnish=smoothstep(.40,.86,large*.69+fine*.31);
    base*=1.0-patina*(.22+.31*tarnish);
  }
  if(brushed>.001){
    // Directional machining marks, restrained to avoid a chrome-like shine.
    float line=.5+.5*sin(vLocal.x*140.0+sin(vLocal.y*12.0)*.9);
    base*=1.0+brushed*(line-.5)*.105;
  }
  float rough=clamp(uRough + .09*(fine-.5)+.11*wear*large+.05*patina*grain,.18,.98);
  vec3 f0=mix(vec3(.042),base,metal);
  vec3 L1=normalize(vec3(-.60,1.12,1.08));
  vec3 L2=normalize(vec3(.74,.36,-1.06));
  vec3 L3=normalize(vec3(.11,.93,-.45));
  vec3 c=directLight(N,V,L1,base,f0,metal,rough,vec3(1.20,1.23,1.20));
  c+=directLight(N,V,L2,base,f0,metal,rough,vec3(.53,.60,.66));
  c+=directLight(N,V,L3,base,f0,metal,rough,vec3(.16,.18,.19));
  float sky=clamp(N.y*.5+.5,0.0,1.0);
  vec3 ambient=mix(vec3(.21,.23,.26),vec3(.37,.41,.46),sky);
  c+=base*(1.0-metal)*ambient*1.05;
  // Gentle bounced light preserves the machined detail without glossy hotspots.
  c+=base*(.095+.055*(1.0-metal))*clamp(.55+.45*N.y,.35,1.0);
  // Studio IBL: physically directional reflections, sampled from embedded cube maps.
  vec3 R=reflect(-V,N);
  vec3 envA=textureCube(uEnvSharp,R).rgb;
  vec3 envB=textureCube(uEnvSoft,R).rgb;
  float blur=smoothstep(.22,.76,rough);
  vec3 env=mix(envA,envB,blur);
  vec3 Fv=fresnel(f0,nv);
  c+=env*Fv*mix(.58,.87,metal)*(1.0-.45*rough);
  // Clear-coated enamel barrel: second dielectric reflection over colored substrate.
  if(uCoat>.001){
    vec3 clearEnv=mix(envA,envB,.85);
    float clearF=.055+.945*pow(1.0-nv,5.0);
    c=mix(c,c*.86,uCoat*.28);
    c+=clearEnv*uCoat*(.11+.25*clearF);
  }
  if(uGlass>.5){
    // Dual-surface coated optical glass: blue/cyan low-reflectance center,
    // violet-blue grazing reflections; remains transparent to the interior.
    float edge=pow(1.0-nv,3.0);
    vec3 film=mix(vec3(.055,.18,.22),vec3(.22,.41,.66),edge);
    vec3 coatedRef=envB*mix(vec3(.18,.31,.36),vec3(.35,.51,.66),edge);
    c=film*.31+coatedRef*(.08+.57*edge);
    c+=directLight(N,V,L1,vec3(.10,.38,.55),vec3(.045),0.0,.10,vec3(.86,1.03,1.12));
    float a=clamp(.12+.43*edge+.07*pow(max(dot(N,L1),0.0),18.0),.12,.65);
    c*=1.15; gl_FragColor=vec4(pow(filmic(c),vec3(.4545)),a);return;
  }
  // Only the parabolic primary receives a radial coating falloff; the flat stays neutral.
  // Subtle lighting contrast is optical-coating appearance, not a fake geometric depression.
  if(uPrimary>.5){
    float rr=length(vec2(vLocal.y-.33,vLocal.z));
    float mid=smoothstep(.05,.58,rr);
    float rim=smoothstep(.60,.79,rr);
    c=mix(c*1.38,c*.72,mid);
    c=mix(c,c*.70,rim);
    float softSweep=.5+.5*cos(atan(vLocal.z,vLocal.y-.33)-.75);
    c+=vec3(.12,.19,.21)*softSweep*(1.0-rim)*.25;
  }
  c=pow(filmic(max(c*1.15,vec3(0.0))),vec3(.4545));
  gl_FragColor=vec4(c,uAlpha);
}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
let program;try{program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));}catch(e){notice.style.display='block';notice.textContent='着色器错误：'+e.message;return;}
gl.useProgram(program);
const attrs={p:gl.getAttribLocation(program,'aPos'),n:gl.getAttribLocation(program,'aNormal')};
const loc=Object.fromEntries(['uVP','uOffset','uCamera','uColor','uMetal','uRough','uAlpha','uGlass','uCoat','uDetail','uWear','uPatina','uBrushed','uPrimary','uOpticalMirror','uWheelAngle','uWheelFlag','uImageFlag','uImageScale'].map(k=>[k,gl.getUniformLocation(program,k)]));
const TAU=Math.PI*2,DEG=Math.PI/180,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),V=(x,y,z)=>[x,y,z],add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],scale=(a,s)=>[a[0]*s,a[1]*s,a[2]*s],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const l=Math.hypot(...a)||1;return scale(a,1/l)};
const materials={
body:{c:[.073,.113,.141],m:.28,r:.75,coat:.05,wear:.64},inner:{c:[.009,.012,.014],m:0,r:.99},
steel:{c:[.24,.29,.31],m:.82,r:.64,brush:.53,patina:.20},graphite:{c:[.072,.084,.092],m:.65,r:.73,wear:.30},
brass:{c:[.37,.252,.125],m:.86,r:.67,patina:.52,brush:.38},oldGold:{c:[.24,.178,.103],m:.74,r:.81,patina:.66},

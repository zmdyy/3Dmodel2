<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>平面镜成像规律</title>
  <style>
    :root {
      --panel-bg: rgba(28, 32, 42, 0.88);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --accent: #3b82f6;
      --danger: #ef4444;
      --track: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Noto Sans SC', system-ui, sans-serif;
      background: #1a1d28; color: var(--text); user-select: none;
    }
    #canvas-wrap { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #panel {
      position: absolute; top: 16px; left: 16px; width: 320px;
      max-height: calc(100% - 32px); overflow-y: auto;
      background: var(--panel-bg); backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border); border-radius: 16px;
      padding: 16px 14px 14px; box-shadow: 0 12px 40px rgba(0,0,0,.35); z-index: 10;
    }
    #panel::-webkit-scrollbar { width: 4px; }
    #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 4px; }
    .section { margin-bottom: 18px; }
    .section-title { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .label { font-size: 15px; color: var(--muted); white-space: nowrap; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .btn {
      flex: 1; min-width: 0; border: none; border-radius: 8px; padding: 8px 6px;
      font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer;
      background: rgba(255,255,255,.08); color: var(--text); transition: background .15s, opacity .15s;
    }
    .btn:hover:not(:disabled) { background: rgba(255,255,255,.14); }
    .btn.active { background: var(--accent); color: #fff; }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn.full { flex: 1 1 100%; }
    .btn.ghost-danger { background: transparent; color: var(--danger); margin-top: 4px; }
    .btn.ghost-danger:hover:not(:disabled) { background: rgba(239,68,68,.12); }
    .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; inset: 0; background: var(--track); border-radius: 24px; cursor: pointer; transition: .2s;
    }
    .switch .slider::before {
      content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .2s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .slider-block { margin-bottom: 12px; }
    .slider-block .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .slider-block .val { font-size: 14px; color: var(--accent); font-variant-numeric: tabular-nums; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
      border-radius: 3px; background: var(--track); outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); cursor: pointer; box-shadow: 0 0 0 3px rgba(59,130,246,.25);
    }
    .hint { font-size: 13px; color: var(--muted); line-height: 1.45; margin-bottom: 8px; }
    #hud { position: absolute; bottom: 16px; left: 16px; display: flex; gap: 8px; z-index: 10; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--panel-border);
      background: var(--panel-bg); backdrop-filter: blur(12px); color: var(--text);
      cursor: pointer; display: grid; place-items: center; font-size: 18px;
    }
    .icon-btn:hover { background: rgba(40,46,60,.95); }
    .icon-btn.active { background: var(--accent); color: #fff; border-color: transparent; }
    .icon-btn.wide { width: auto; padding: 0 14px; border-radius: 20px; font-size: 14px; font-family: inherit; font-weight: 500; }
    #mode-tip {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(20,24,34,.85); border: 1px solid var(--panel-border);
      padding: 8px 14px; border-radius: 999px; font-size: 12px; color: var(--muted);
      z-index: 10; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap;
    }
    #mode-tip.show { opacity: 1; }
    #size-readout {
      background: rgba(0,0,0,.22);
      border-radius: 10px;
      padding: 10px 10px 12px;
      font-size: 14px;
      line-height: 1.65;
    }
    #size-readout .wait { color: var(--muted); }
    #size-readout .eq { color: #34d399; font-weight: 600; }
    #size-readout .row-num { display: flex; justify-content: space-between; gap: 8px; }
    #size-readout .row-num span:last-child {
      color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 600;
    }
  </style>
<script src="../shared/navigation-style.js?v=20261018-nav1"></script>
</head>
<body>
  <div id="canvas-wrap"></div>
  <aside id="panel">
    <div class="section">
      <div class="section-title">设置</div>
      <div class="btn-group" id="material-group">
        <button class="btn" data-material="mirror">平面镜</button>
        <button class="btn active" data-material="clear">透明玻璃</button>
        <button class="btn" data-material="tea">茶色玻璃</button>
      </div>
      <div class="row">
        <span class="label">固定镜面</span>
        <label class="switch"><input type="checkbox" id="fix-mirror" checked /><span class="slider"></span></label>
      </div>
      <div class="slider-block">
        <div class="top"><span class="label">推窗</span><span class="val" id="window-val">居中</span></div>
        <input type="range" id="window-slide" min="-100" max="100" value="0" />
        <div class="hint">沿镜面左右推开；请在斜视下观察是否还能看见像</div>
      </div>
      <div class="row">
        <span class="label">桌面</span>
        <div class="btn-group" style="margin:0;flex:1;">
          <button class="btn active" id="paper-white">白纸</button>
          <button class="btn" id="paper-grid">方格纸</button>
        </div>
      </div>
      <div class="slider-block">
        <div class="top"><span class="label">镜面厚度</span><span class="val" id="thickness-val">1.0 mm</span></div>
        <input type="range" id="thickness" min="0" max="100" value="0" />
        <div class="hint">越厚，玻璃中重影越明显（平面镜无重影）</div>
      </div>
      <div class="slider-block">
        <div class="top"><span class="label">镜面角度</span><span class="val" id="tilt-val">0°</span></div>
        <input type="range" id="tilt" min="-30" max="30" value="0" />
        <div class="hint">前倾 / 后仰；倾斜后像离开桌面，不可点像的位置</div>
      </div>
    </div>
    <div class="section">
      <div class="section-title">绘制</div>
      <div class="btn-group" id="mode-group">
        <button class="btn active" data-mode="point">点点模式</button>
        <button class="btn" data-mode="measure">测距模式</button>
      </div>
      <div class="btn-group" id="tool-group">
        <button class="btn full" data-tool="object">物的位置</button>
        <button class="btn full" data-tool="image">像的位置</button>
        <button class="btn full" data-tool="mirrorLine">平面镜位置</button>
        <button class="btn full" data-tool="ruler" disabled>尺子辅助线</button>
        <button class="btn full" data-tool="erase">擦除</button>
      </div>
      <button class="btn ghost-danger full" id="clear-draw">清除绘制</button>
    </div>
    <div class="section">
      <div class="section-title">特殊视角</div>
      <div class="btn-group" id="view-group">
        <button class="btn active" data-view="oblique">斜视</button>
        <button class="btn" data-view="top">俯视</button>
        <button class="btn" data-view="side">侧视</button>
      </div>
      <div class="hint">侧视查看成像光路；俯视用于桌面测距；推窗请用斜视</div>
    </div>
    <div class="section">
      <div class="section-title">像的大小</div>
      <div id="size-readout">
        <div class="wait" id="size-wait">将未燃蜡烛移到与像重合处，自动读出物高与像高</div>
        <div id="size-nums" hidden>
          <div class="row-num"><span>物高 h</span><span id="h-obj">—</span></div>
          <div class="row-num"><span>像高 h′</span><span id="h-img">—</span></div>
          <div class="row-num"><span>h′ / h</span><span id="h-ratio">—</span></div>
          <div class="eq" id="h-judge"></div>
        </div>
      </div>
    </div>
  </aside>
  <div id="hud">
    <button class="icon-btn" id="reset-cam" title="重置视角">↻</button>
  </div>
  <div id="mode-tip"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "../shared/vendor/three-r160/build/three.module.js",
      "three/addons/": "../shared/vendor/three-r160/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';

const CM = 0.04;
const PAPER_W = 56;
const PAPER_D = 40;
const PAPER_Y = 0.002;
const MIRROR_H = 0.98;
const MIRROR_W = PAPER_D * CM * 0.86;
const THICK_MIN = 0.1 * CM; // 1 mm
const THICK_MAX = 1 * CM;   // 1 cm
const BODY_H = 0.18;
const FLAME_H = 0.092;
const FLAME_BASE_Y = 0.208;
const INNER_FLAME_H = FLAME_H * 0.82;
const INNER_FLAME_Y = FLAME_BASE_Y + 0.004;
const VISUAL_TIP_Y = INNER_FLAME_Y + INNER_FLAME_H;
const FLAME_TIP_Y = VISUAL_TIP_Y;
const DIM_CONE_H = 0.034;
const WINDOW_Z_MAX = (PAPER_D * CM) / 2 * 0.72;
const COINCIDE_R = 1.6 * CM;
const RAY_PINK = 0xff2d8a;
const RAY_COUNT = 3;
const fatLineMats = [];

const state = {
  material: 'clear',
  fixMirror: true,
  paperGrid: false,
  thickness: 0,
  tiltDeg: 0,
  windowT: 0,
  drawMode: 'point',
  tool: null,
  rulerFirst: null,
  dragging: null,
  markQueue: [],
  pencilBusy: false,
  viewMode: 'oblique',
  coincided: false,
};

const CIRCLE_R = 1.2 * CM;
const SNAP_R = 1.0 * CM;
let markIdSeq = 1;

const marks = { objects: [], images: [], mirrorLine: null, measures: [], rulers: [] };

const tipEl = document.getElementById('mode-tip');
const wrap = document.getElementById('canvas-wrap');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(Math.max(devicePixelRatio, 1.5), 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x66686a);
scene.fog = null;
const environmentGenerator = new THREE.PMREMGenerator(renderer);
const environmentRoom = new RoomEnvironment();
const environmentTarget = environmentGenerator.fromScene(environmentRoom, 0.025);
scene.environment = environmentTarget.texture;
environmentRoom.dispose();
environmentGenerator.dispose();
const overlayRoot = new THREE.Group();
scene.add(overlayRoot);

// 浅色房间内壁：镜面斜视时反射到实验室灰，而不是虚空黑洞
const room = new THREE.Mesh(
  new THREE.BoxGeometry(14, 8, 14),
  new THREE.MeshBasicMaterial({ color: 0x727476, side: THREE.BackSide })
);
room.position.y = 2.5;
scene.add(room);

const perspCamera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 50);
const OBLIQUE_POS = new THREE.Vector3(-2.55, 1.6, 1.2);
const OBLIQUE_TARGET = new THREE.Vector3(0, 0.3, 0);
perspCamera.position.copy(OBLIQUE_POS);

const TABLE_HALF_W = (PAPER_W * CM + 0.48) / 2;
const TABLE_HALF_D = (PAPER_D * CM + 0.38) / 2;
function makeOrthoFrustum() {
  const aspect = innerWidth / Math.max(1, innerHeight);
  const margin = 0.35;
  const fitH = TABLE_HALF_D + margin;
  const fitW = TABLE_HALF_W + margin;
  const halfH = Math.max(fitH, fitW / aspect);
  const halfW = halfH * aspect;
  return { left: -halfW, right: halfW, top: halfH, bottom: -halfH };
}
const orthoFrust = makeOrthoFrustum();
const orthoCamera = new THREE.OrthographicCamera(
  orthoFrust.left, orthoFrust.right, orthoFrust.top, orthoFrust.bottom, 0.1, 40
);
orthoCamera.position.set(0, 6, 0);
orthoCamera.up.set(0, 0, -1);
orthoCamera.lookAt(0, 0, 0);

let camera = perspCamera;

const controls = Navigation3D.configureOrbit(new OrbitControls(camera, renderer.domElement));
controls.target.copy(OBLIQUE_TARGET);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 1.4;
controls.maxDistance = 8;
controls.minZoom = 0.45;
controls.maxZoom = 3.5;

scene.add(new THREE.AmbientLight(0xffffff, 0.22));
scene.add(new THREE.HemisphereLight(0xf6f8fa, 0x544839, 0.32));
const key = new THREE.DirectionalLight(0xfff8ed, 2.1);
key.position.set(-2.5, 4.5, 2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.normalBias = 0.003;
key.shadow.bias = -0.0001;
key.shadow.radius = 2;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 14;
key.shadow.camera.left = -1.9;
key.shadow.camera.right = 1.9;
key.shadow.camera.top = 1.9;
key.shadow.camera.bottom = -1.9;
scene.add(key);
const fillLight = new THREE.DirectionalLight(0xeef4ff, 0.55);
fillLight.position.set(3, 2, -3);
scene.add(fillLight);

// Deterministic fine grain: no new random texture or allocation per frame.
function makeWoodTexture() {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 1024;
  const g = c.getContext('2d');
  const pixels = g.createImageData(c.width, c.height);
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    const bend = Math.sin(x * 0.0035) * 8 + Math.sin(x * 0.011) * 1.8;
    const grain = Math.sin((y + bend) * 0.53) * 3.4 + Math.sin((y + bend) * 1.7) * 1.6;
    const growth = Math.sin((y + bend) * 0.048) * 6;
    const noise = (Math.sin(x * 12.9898 + y * 78.233) * 43758.5453 % 1) * 1.6;
    const v = grain + growth + noise;
    const i = (y*c.width+x)*4;
    pixels.data[i]=126+v; pixels.data[i+1]=88+v*.83; pixels.data[i+2]=56+v*.65; pixels.data[i+3]=255;
  }
  g.putImageData(pixels,0,0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
  return tex;
}
function makeMicroTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); const d = g.createImageData(256,256);
  for(let i=0;i<d.data.length;i+=4) {const n=126+Math.sin(i*1.37)*6; d.data[i]=d.data[i+1]=d.data[i+2]=n;d.data[i+3]=255;}
  g.putImageData(d,0,0); const t = new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3); return t;
}
const microTexture = makeMicroTexture();

function makePaperTexture(grid) {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const g = c.getContext('2d');
  // Slight warm gray paper: preserve headroom for lighting and reflections.
  g.fillStyle = '#d5d2cb';
  g.fillRect(0, 0, 1024, 1024);
  const fibers = g.getImageData(0, 0, 1024, 1024);
  for (let i = 0; i < fibers.data.length; i += 4) {
    const n = Math.sin(i * 0.137) * 0.75;
    fibers.data[i] += n; fibers.data[i + 1] += n; fibers.data[i + 2] += n;
  }
  g.putImageData(fibers, 0, 0);
  if (grid) {
    const stepX = 1024 / PAPER_W;
    const stepZ = 1024 / PAPER_D;
    g.strokeStyle = '#a9aaa7';
    g.lineWidth = 1;
    for (let i = 0; i <= PAPER_W; i++) {
      const x = i * stepX;
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1024); g.stroke();
    }
    for (let j = 0; j <= PAPER_D; j++) {
      const y = j * stepZ;
      g.beginPath(); g.moveTo(0, y); g.lineTo(1024, y); g.stroke();
    }
    g.strokeStyle = '#858b8c';
    g.lineWidth = 1.5;
    for (let i = 0; i <= PAPER_W; i += 5) {
      const x = i * stepX;
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 1024); g.stroke();
    }
    for (let j = 0; j <= PAPER_D; j += 5) {
      const y = j * stepZ;
      g.beginPath(); g.moveTo(0, y); g.lineTo(1024, y); g.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

const table = new THREE.Mesh(
  new THREE.BoxGeometry(PAPER_W * CM + 0.48, 0.08, PAPER_D * CM + 0.38),
  new THREE.MeshStandardMaterial({ map: makeWoodTexture(), roughness: 0.69, bumpMap: microTexture, bumpScale: 0.00035, envMapIntensity: 0.25 })
);
table.position.y = -0.04;
table.receiveShadow = true;
table.castShadow = true;
scene.add(table);

const paperMat = new THREE.MeshStandardMaterial({ map: makePaperTexture(false), roughness: 0.97, bumpMap: microTexture, bumpScale: 0.00007, envMapIntensity: 0.08 });
const paper = new THREE.Mesh(new THREE.PlaneGeometry(PAPER_W * CM, PAPER_D * CM), paperMat);
paper.rotation.x = -Math.PI / 2;
paper.position.y = PAPER_Y;
paper.receiveShadow = true;
scene.add(paper);
const paperPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -PAPER_Y);

function setPaperGrid(on) {
  state.paperGrid = on;
  paperMat.map?.dispose();
  paperMat.map = makePaperTexture(on);
  paperMat.needsUpdate = true;
  document.getElementById('paper-white').classList.toggle('active', !on);
  document.getElementById('paper-grid').classList.toggle('active', on);
}

function currentThickness() {
  return THREE.MathUtils.lerp(THICK_MIN, THICK_MAX, state.thickness);
}

/* —— 镜面组 —— */
const mirrorGroup = new THREE.Group();
scene.add(mirrorGroup);

const glassVolume = new THREE.Mesh(
  new THREE.BoxGeometry(1, MIRROR_H, MIRROR_W),
  new THREE.MeshPhysicalMaterial({
    color: 0xf0faf6,
    clearcoat: 0.8, clearcoatRoughness: 0.07, envMapIntensity: 0.45,
    transparent: true,
    opacity: 0.065,
    roughness: 0.08,
    metalness: 0,
    depthWrite: false,
    side: THREE.DoubleSide,
  })
);
glassVolume.position.y = MIRROR_H / 2;
mirrorGroup.add(glassVolume);
// Actual cut surfaces follow thickness; fine silhouettes stay legible at normal distance.
const glassEdges = new THREE.Group();
const edgeMaterial = new THREE.MeshPhysicalMaterial({color:0x398879,roughness:0.19,metalness:0,
  transparent:true,opacity:0.82,depthWrite:false,envMapIntensity:0.65});
for (const y of [0,MIRROR_H]) {
  const edge = new THREE.Mesh(new THREE.BoxGeometry(1,0.0024,MIRROR_W),edgeMaterial);
  edge.position.y=y;glassEdges.add(edge);
}
for (const z of [-MIRROR_W/2,MIRROR_W/2]) {
  const edge = new THREE.Mesh(new THREE.BoxGeometry(1,MIRROR_H,0.0024),edgeMaterial);
  edge.position.set(0,MIRROR_H/2,z);glassEdges.add(edge);
}
mirrorGroup.add(glassEdges);
const edgeOutline = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1,MIRROR_H,MIRROR_W)),
  new THREE.LineBasicMaterial({color:0x418d80,transparent:true,opacity:0.72,depthWrite:false}));
edgeOutline.position.y=MIRROR_H/2;mirrorGroup.add(edgeOutline);


const opaqueBack = new THREE.Mesh(
  new THREE.PlaneGeometry(MIRROR_W, MIRROR_H),
  new THREE.MeshStandardMaterial({
    color: 0x3d4555,
    roughness: 0.4,
    metalness: 0.55,
    side: THREE.DoubleSide,
  })
);
opaqueBack.rotation.y = -Math.PI / 2;
opaqueBack.position.set(0.003, MIRROR_H / 2, 0);
mirrorGroup.add(opaqueBack);

/** 反射面：Reflector + 浅色清屏，斜视空洞不再变黑 */
function makeReflector(colorHex) {
  const ref = new Reflector(new THREE.PlaneGeometry(MIRROR_W, MIRROR_H), {
    clipBias: 0.02,
    textureWidth: Math.floor(Math.min(2048, innerWidth * renderer.getPixelRatio())),
    textureHeight: Math.floor(Math.min(2048, innerHeight * renderer.getPixelRatio())),
    color: new THREE.Color(colorHex),
  });
  ref.rotation.y = -Math.PI / 2;
  ref.position.y = MIRROR_H / 2;
  ref.material.transparent = true;
  ref.material.depthWrite = false;
  ref.material.uniforms.opacity = { value: 0.45 };
  ref.material.fragmentShader = ref.material.fragmentShader
    .replace('uniform vec3 color;', 'uniform vec3 color;\n\tuniform float opacity;')
    .replace(
      'gl_FragColor = vec4( blendOverlay( base.rgb, color ), 1.0 );',
      'gl_FragColor = vec4( base.rgb * color, opacity );'
    );
  ref.userData.setOpacity = (v) => { ref.material.uniforms.opacity.value = v; };

  // 反射通道清成实验室浅灰，避免虚拟相机裁切后出现黑洞
  const prevOnBefore = ref.onBeforeRender;
  ref.onBeforeRender = function (renderer, scene, camera) {
    const prevColor = new THREE.Color();
    const prevAlpha = renderer.getClearAlpha();
    renderer.getClearColor(prevColor);
    renderer.setClearColor(0x727476, 1);
    // 渲染时隐藏另一张反射面，防止递归
    const other = this === frontReflector ? backReflector : frontReflector;
    const wasOther = other.visible;
    other.visible = false;
    const wasOpaque = opaqueBack.visible;
    const wasSA = supportA.visible;
    const wasSB = supportB.visible;
    const wasOverlay = overlayRoot.visible;
    const wasGlass = glassVolume.visible;
    const wasEdges = glassEdges.visible;
    const wasOutline = edgeOutline.visible;
    glassVolume.visible = glassEdges.visible = edgeOutline.visible = false;
    // 平面镜正面绘制反射时暂时藏起深色背板与支架，避免透黑/黑块
    if (state.material === 'mirror') opaqueBack.visible = false;
    supportA.visible = false;
    supportB.visible = false;
    overlayRoot.visible = false;
    prevOnBefore.call(this, renderer, scene, camera);
    other.visible = wasOther;
    opaqueBack.visible = wasOpaque;
    supportA.visible = wasSA;
    supportB.visible = wasSB;
    overlayRoot.visible = wasOverlay;
    glassVolume.visible = wasGlass;
    glassEdges.visible = wasEdges;
    edgeOutline.visible = wasOutline;
    renderer.setClearColor(prevColor, prevAlpha);
  };
  return ref;
}

function makeSupport(zSign) {

  upright.position.set(0.024, 0.048, 0);

function makeFlameProfile(height, widthScale) {
  const pts = [];
  for (let i = 0; i <= 20; i++) {
    const t = i / 20;
    const y = t * height;
    const bell = Math.sin(Math.PI * Math.min(1, t * 1.08));
    const taper = 1 - Math.pow(t, 1.35) * 0.55;
    const w = Math.max(0.0012, bell * 0.026 * widthScale * taper);
    pts.push(new THREE.Vector2(w, y));
  }
  return pts;
}

const flameVert = /* glsl */`
uniform float uTime;
uniform float uHeight;
varying vec3 vLocal;
varying float vY01;
void main() {
  vec3 p = position;
  float y01 = clamp(p.y / max(uHeight, 0.001), 0.0, 1.0);
  float sway = sin(uTime * 5.6) * 0.014 + sin(uTime * 9.3 + 1.7) * 0.007;
  float n = sin(uTime * 14.0 + p.y * 48.0) * 0.55 + sin(uTime * 21.0 + p.x * 36.0);
  p.x += (sway + n * 0.004) * y01;
  p.z += cos(uTime * 6.4 + 0.4) * 0.009 * y01;
  float slim = 1.0 + sin(uTime * 17.5) * 0.07 * y01;
  p.x *= slim;
  p.z *= 0.92 * slim;
  p.y *= 1.0 + sin(uTime * 8.6) * 0.02;
  vLocal = p;
  vY01 = clamp(p.y / max(uHeight, 0.001), 0.0, 1.0);
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}
`;

const flameFrag = /* glsl */`
uniform float uTime;
uniform float uBoost;
varying vec3 vLocal;
varying float vY01;
void main() {
  float r = length(vLocal.xz);
  float maxR = mix(0.004, 0.024, sin(vY01 * 3.14159) * (1.0 - 0.42 * vY01));
  float core = smoothstep(maxR * 0.85, maxR * 0.08, r);
  float envelope = smoothstep(maxR * 1.25, maxR * 0.22, r);
  vec3 blue = vec3(0.18, 0.42, 1.0);
  vec3 orange = vec3(1.0, 0.40, 0.04);
  vec3 yellow = vec3(1.0, 0.88, 0.32);
  vec3 white = vec3(1.0, 0.97, 0.88);
  vec3 col = mix(blue, orange, smoothstep(0.0, 0.16, vY01));
  col = mix(col, yellow, smoothstep(0.12, 0.42, vY01));
  col = mix(col, white, smoothstep(0.38, 0.82, vY01) * core);
  float flicker = 0.9 + 0.1 * sin(uTime * 22.0);
  float alpha = envelope * (0.5 + 0.5 * core) * flicker * uBoost;
  alpha *= smoothstep(0.0, 0.05, vY01);
  alpha *= 1.0 - smoothstep(0.9, 1.0, vY01) * 0.25;
  if (alpha < 0.03) discard;
  gl_FragColor = vec4(col, clamp(alpha, 0.0, 1.0));
}
`;

function makeFlameMaterial(boost, additive, height = INNER_FLAME_H) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uHeight: { value: height },
      uBoost: { value: boost },
    },
    vertexShader: flameVert,
    fragmentShader: flameFrag,
    transparent: true,
    depthWrite: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    side: THREE.DoubleSide,
  });
}

function createCandle(lit) {
  const g = new THREE.Group();

    new THREE.CylinderGeometry(0.028, 0.032, BODY_H, 64),

  );
  body.position.y = BODY_H / 2;
  body.castShadow = true;
  body.receiveShadow = true;
  g.add(body);

  const melt = new THREE.Mesh(
    new THREE.CylinderGeometry(0.030, 0.028, 0.012, 64),
    new THREE.MeshStandardMaterial({
      color: 0xf4e6c7,
      roughness: 0.35,
      metalness: 0.05,
    })
  );
  melt.position.y = BODY_H - 0.002;
  g.add(melt);
  const waxRim = new THREE.Mesh(new THREE.TorusGeometry(0.023,0.003,10,64),
    new THREE.MeshStandardMaterial({color:0xf2e5c6,roughness:0.48,envMapIntensity:0.3}));
  waxRim.rotation.x=Math.PI/2;waxRim.position.y=BODY_H+0.004;g.add(waxRim);
  const well = new THREE.Mesh(new THREE.CircleGeometry(0.02,48),
    new THREE.MeshStandardMaterial({color:0xc9b999,roughness:0.47}));
  well.rotation.x=-Math.PI/2;well.position.y=BODY_H+0.001;g.add(well);

  if (lit) {
    const wickCurve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(0, BODY_H - 0.004, 0),
      new THREE.Vector3(0.006, BODY_H + 0.018, 0.002),
      new THREE.Vector3(0.011, BODY_H + 0.028, 0.003)
    );
    const wick = new THREE.Mesh(
      new THREE.TubeGeometry(wickCurve, 10, 0.0024, 6, false),
      new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.9 })
    );
    g.add(wick);
    const ember = new THREE.Mesh(
      new THREE.SphereGeometry(0.0032, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xff4a18 })
    );
    ember.position.set(0.011, BODY_H + 0.028, 0.003);
    g.add(ember);

    const outerMat = makeFlameMaterial(0.22, true, INNER_FLAME_H * 1.06);
    const innerMat = makeFlameMaterial(1.15, false, INNER_FLAME_H);
    const outer = new THREE.Mesh(new THREE.LatheGeometry(makeFlameProfile(INNER_FLAME_H * 1.06, 1.05), 20), outerMat);
    const inner = new THREE.Mesh(new THREE.LatheGeometry(makeFlameProfile(INNER_FLAME_H, 0.72), 18), innerMat);
    outer.position.y = INNER_FLAME_Y;
    inner.position.y = INNER_FLAME_Y;
    outer.renderOrder = 2;
    inner.renderOrder = 3;
    g.add(outer, inner);

    const light = new THREE.PointLight(0xffb96b, 0.12, 0.52, 2);
    light.position.set(0, FLAME_BASE_Y + 0.04, 0);
    g.add(light);

    g.userData = { lit: true, flameMats: [outerMat, innerMat], light, flameTipLocal: new THREE.Vector3(0, VISUAL_TIP_Y, 0) };
  } else {
    const wick = new THREE.Mesh(
      new THREE.CylinderGeometry(0.0022, 0.0026, 0.018, 6),
      new THREE.MeshStandardMaterial({ color: 0x2a221c })
    );
    wick.position.y = BODY_H + 0.008;
    g.add(wick);
    g.userData = { lit: false, flameMats: [], light: null, flameTipLocal: new THREE.Vector3(0, BODY_H + 0.016, 0) };
  }
  return g;
}

function applyMaterialVisual() {
  const t = state.thickness;
  const ghost = Math.pow(t, 0.85);
  const isMirror = state.material === 'mirror';
  glassEdges.visible = true;
  edgeOutline.material.color.set(isMirror ? 0x9ca5aa : state.material === 'tea' ? 0x826232 : 0x418d80);
  edgeMaterial.color.set(isMirror ? 0xa9b2b8 : state.material === 'tea' ? 0x826232 : 0x398879);
  edgeMaterial.metalness = isMirror ? 0.75 : 0;
  edgeMaterial.roughness = isMirror ? 0.38 : 0.19;
  edgeMaterial.opacity = isMirror ? 1 : 0.82;
  edgeOutline.material.opacity = isMirror ? 0.88 : 0.72;
  if (frontReflector.material.transparent === isMirror) {
    frontReflector.material.transparent = !isMirror;
    frontReflector.material.needsUpdate = true;
  }
  frontReflector.material.depthWrite = isMirror;

  if (state.material === 'mirror') {
    glassVolume.visible = false;
    opaqueBack.visible = true;
    frontReflector.visible = true;
    backReflector.visible = false;
    frontReflector.userData.setOpacity(1);
    frontReflector.material.uniforms.color.value.set(0xffffff);
  } else if (state.material === 'clear') {
    glassVolume.visible = true;
    opaqueBack.visible = false;
    frontReflector.visible = true;
    backReflector.visible = ghost > 0.04;
    glassVolume.material.color.set(0xf0faf6);
    glassVolume.material.opacity = 0.055 + t * 0.045;
    frontReflector.userData.setOpacity(0.36 + ghost * 0.12);
    backReflector.userData.setOpacity(0.13 + ghost * 0.27);
    frontReflector.material.uniforms.color.value.set(0xffffff);
    backReflector.material.uniforms.color.value.set(0xf5faf8);
  } else {
    glassVolume.visible = true;
    opaqueBack.visible = false;
    frontReflector.visible = true;
    backReflector.visible = ghost > 0.04;
    glassVolume.material.color.set(0x8b6914);
    glassVolume.material.opacity = 0.18 + t * 0.16;
    frontReflector.userData.setOpacity(0.32 + ghost * 0.25);
    backReflector.userData.setOpacity(0.22 + ghost * 0.35);
    frontReflector.material.uniforms.color.value.set(0xf0e2c9);
    backReflector.material.uniforms.color.value.set(0xe7d4af);
  }
}

function updateMirrorGeometry() {
  const thick = currentThickness();
  glassVolume.scale.set(thick, 1, 1);
  glassEdges.scale.x = thick;
  edgeOutline.scale.x = thick;
  const half = thick / 2;
  frontReflector.position.x = -half;
  backReflector.position.x = half;
  opaqueBack.position.x = half + 0.0015;
  applyMaterialVisual();
}

function updateMirrorTransform() {
  mirrorGroup.rotation.z = THREE.MathUtils.degToRad(state.tiltDeg);
  updateMirrorGeometry();
  clampAllObjects();
  refreshMeasureLines();
  updateImageToolEnabled();
}

function getMirrorCenterX() {
  return mirrorGroup.position.x;
}

function isTilted() {
  return Math.abs(state.tiltDeg) > 0.5;
}

function paperBounds() {
  const hw = (PAPER_W * CM) / 2 - 0.04;
  const hd = (PAPER_D * CM) / 2 - 0.04;
  return { hw, hd };
}

function clampToPaper(pos) {
  const { hw, hd } = paperBounds();
  pos.x = THREE.MathUtils.clamp(pos.x, -hw, hw);
  pos.z = THREE.MathUtils.clamp(pos.z, -hd, hd);
  return pos;
}

function clampLitCandle() {
  const mx = getMirrorCenterX();
  const half = currentThickness() / 2 + 0.05;
  const { hw, hd } = paperBounds();
  litCandle.position.x = THREE.MathUtils.clamp(litCandle.position.x, -hw, mx - half);
  litCandle.position.z = THREE.MathUtils.clamp(litCandle.position.z, -hd, hd);
  litCandle.position.y = 0;
}

function clampUnlitCandle() {
  const mx = getMirrorCenterX();
  const half = currentThickness() / 2 + 0.05;
  const { hw, hd } = paperBounds();
  unlitCandle.position.x = THREE.MathUtils.clamp(unlitCandle.position.x, mx + half, hw);
  unlitCandle.position.z = THREE.MathUtils.clamp(unlitCandle.position.z, -hd, hd);
  unlitCandle.position.y = 0;
}

function clampScreen() {
  const mx = getMirrorCenterX();
  const half = currentThickness() / 2 + 0.06;
  const { hw, hd } = paperBounds();
  screenGroup.position.x = THREE.MathUtils.clamp(screenGroup.position.x, mx + half, hw);
  screenGroup.position.z = THREE.MathUtils.clamp(screenGroup.position.z, -hd, hd);
  screenGroup.position.y = 0;
}

function clampMirror() {
  const { hw } = paperBounds();
  mirrorGroup.position.x = THREE.MathUtils.clamp(mirrorGroup.position.x, -hw * 0.5, hw * 0.5);
  mirrorGroup.position.z = THREE.MathUtils.clamp(mirrorGroup.position.z, -WINDOW_Z_MAX, WINDOW_Z_MAX);
  mirrorGroup.position.y = 0;
  state.windowT = THREE.MathUtils.clamp(mirrorGroup.position.z / WINDOW_Z_MAX, -1, 1);
  syncWindowSlider();
}

function syncWindowSlider() {
  const slider = document.getElementById('window-slide');
  const label = document.getElementById('window-val');
  if (!slider || !label) return;
  if (document.activeElement !== slider) slider.value = String(Math.round(state.windowT * 100));
  const cm = (mirrorGroup.position.z / CM);
  if (Math.abs(cm) < 0.15) label.textContent = '居中';
  else label.textContent = cm > 0 ? `右 ${cm.toFixed(1)} cm` : `左 ${(-cm).toFixed(1)} cm`;
}

function setWindowSlide(t) {
  state.windowT = THREE.MathUtils.clamp(t, -1, 1);
  mirrorGroup.position.z = state.windowT * WINDOW_Z_MAX;
  clampAllObjects();
  if (marks.mirrorLine) setMirrorLine();
  syncWindowSlider();
}

function clampAllObjects() {
  clampMirror();
  clampLitCandle();
  clampUnlitCandle();
  clampScreen();
}

function mirrorPoint(p) {
  const local = mirrorGroup.worldToLocal(p.clone());
  local.x = -local.x;
  return mirrorGroup.localToWorld(local);

function getFrontMirrorPlane() {
  const n = new THREE.Vector3();
  frontReflector.getWorldDirection(n);
  const wp = new THREE.Vector3();
  frontReflector.getWorldPosition(wp);
  return new THREE.Plane().setFromNormalAndCoplanarPoint(n, wp);
}

function intersectLinePlane(a, b, plane) {
  const dir = b.clone().sub(a);
  const len = dir.length();
  if (len < 1e-8) return null;
  const hit = new THREE.Ray(a, dir.multiplyScalar(1 / len)).intersectPlane(plane, new THREE.Vector3());
  return hit;
}

/* —— 侧视光路 —— */
function makeFatLine(color, width, dashed = false, worldUnits = false) {
  const geo = new LineGeometry();
  geo.setPositions([0, 0, 0, 0, 0.01, 0]);
  const mat = new LineMaterial({
    color,
    linewidth: width,
    dashed,
    dashSize: dashed ? 0.032 : 1,
    gapSize: dashed ? 0.018 : 1,
    depthTest: false,
    transparent: true,
    worldUnits,
  });
  mat.resolution.set(innerWidth, innerHeight);
  fatLineMats.push(mat);
  const line = new Line2(geo, mat);
  line.renderOrder = 6;
  line.computeLineDistances();
  return line;
}

function setFatLine(line, a, b, visible) {
  line.visible = !!visible;
  if (!visible) return;
  line.geometry.setPositions([a.x, a.y, a.z, b.x, b.y, b.z]);
  line.computeLineDistances();
}

function setFatPolyline(line, pts) {
  const pos = [];
  pts.forEach(p => {
    if (p.isVector3) pos.push(p.x, p.y, p.z);
    else pos.push(p[0], p[1], p[2]);
  });
  line.geometry.setPositions(pos);
  line.computeLineDistances();
}

function makeFatPolyline(pts, color, width, dashed = false, worldUnits = false) {
  const geo = new LineGeometry();
  const pos = [];
  pts.forEach(p => pos.push(p.x, p.y, p.z));
  geo.setPositions(pos);
  const mat = new LineMaterial({
    color,
    linewidth: width,
    dashed,
    dashSize: dashed ? 0.016 : 1,
    gapSize: dashed ? 0.01 : 1,
    depthTest: false,
    transparent: true,
    worldUnits,
  });
  mat.resolution.set(innerWidth, innerHeight);
  fatLineMats.push(mat);
  const line = new Line2(geo, mat);
  line.renderOrder = 5;
  line.computeLineDistances();
  return line;
}

function makeEyeSprite() {
  const c = document.createElement('canvas');
  c.width = 200; c.height = 160;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 200, 160);
  ctx.strokeStyle = '#111';
  ctx.fillStyle = '#111';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(30, 52);
  ctx.quadraticCurveTo(110, 8, 175, 58);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(36, 100);
  ctx.quadraticCurveTo(100, 58, 168, 100);
  ctx.quadraticCurveTo(100, 138, 36, 100);
  ctx.closePath();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(118, 98, 11, 0, Math.PI * 2);
  ctx.fill();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  spr.scale.set(0.2, 0.16, 1);
  spr.renderOrder = 8;

}

const vectorTextPendings = [];

function applyVectorText(g) {
  if (!dimFont) return;
  if (g.userData.mesh) {
    g.remove(g.userData.mesh);
    g.userData.mesh.geometry.dispose();
    g.userData.mesh.material.dispose();
  }
  const shapes = dimFont.generateShapes(g.userData.text, g.userData.size);
  const geo = new THREE.ShapeGeometry(shapes);
  geo.computeBoundingBox();
  const bb = geo.boundingBox;
  geo.translate(-(bb.min.x + bb.max.x) / 2, -(bb.min.y + bb.max.y) / 2, 0);
  geo.computeBoundingBox();
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color: g.userData.color,
    depthTest: false,
    depthWrite: false,
    transparent: true,
    side: THREE.DoubleSide,
  }));
  mesh.renderOrder = 20;
  g.add(mesh);
  g.userData.mesh = mesh;
}

function makeVectorText(text, color, size) {
  const g = new THREE.Group();
  g.userData = { text, color, size, mesh: null };
  vectorTextPendings.push(g);
  if (dimFont) applyVectorText(g);
  return g;
}

function setVectorText(g, text) {
  if (g.userData.text === text && g.userData.mesh) return;
  g.userData.text = text;
  applyVectorText(g);
}

function makeDashedGhostCandle() {
  const g = new THREE.Group();
  const bw = 0.028;
  const body = makeFatPolyline([
    new THREE.Vector3(-bw, 0.003, 0),
    new THREE.Vector3(bw, 0.003, 0),
    new THREE.Vector3(bw, BODY_H, 0),
    new THREE.Vector3(-bw, BODY_H, 0),
    new THREE.Vector3(-bw, 0.003, 0),
  ], 0xc9a0b0, 2.2, true);
  const fpts = [];
  const n = 18;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const y = INNER_FLAME_Y + t * INNER_FLAME_H;
    const bell = Math.sin(Math.PI * Math.min(1, t * 1.08));
    const taper = 1 - Math.pow(t, 1.35) * 0.55;
    const w = Math.max(0.0012, bell * 0.026 * 0.72 * taper);
    fpts.push(new THREE.Vector3(w, y, 0));
  }
  for (let i = n; i >= 0; i--) {
    const t = i / n;
    const y = INNER_FLAME_Y + t * INNER_FLAME_H;
    const bell = Math.sin(Math.PI * Math.min(1, t * 1.08));
    const taper = 1 - Math.pow(t, 1.35) * 0.55;
    const w = Math.max(0.0012, bell * 0.026 * 0.72 * taper);
    fpts.push(new THREE.Vector3(-w, y, 0));
  }
  g.add(body, makeFatPolyline(fpts, 0xd4a010, 2.2, true));
  g.visible = false;
  overlayRoot.add(g);
  return g;
}

function makeArrowMesh(color, height = 0.036) {
  const mesh = new THREE.Mesh(
    new THREE.ConeGeometry(height * 0.33, height, 12),
    new THREE.MeshBasicMaterial({ color, depthTest: false })
  );
  mesh.userData.coneH = height;
  mesh.renderOrder = 8;
  return mesh;
}

function placeArrow(arrow, from, to, t, visible) {
  arrow.visible = !!visible;
  if (!visible) return;
  const dir = to.clone().sub(from);
  const len = dir.length();
  if (len < 1e-4) { arrow.visible = false; return; }
  dir.multiplyScalar(1 / len);
  arrow.position.copy(from).addScaledVector(dir, len * t);
  arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
}

const rayState = {
  group: new THREE.Group(),
  inc: [],
  refl: [],
  dash: [],
  incArrows: [],
  reflArrows: [],
  eye: makeEyeSprite(),
  labelS: makeRayLabel('S'),
  labelSp: makeRayLabel("S'"),
  glassBar: null,
  ghost: null,
};
overlayRoot.add(rayState.group);
for (let i = 0; i < RAY_COUNT; i++) {
  const inc = makeFatLine(RAY_PINK, 4.2, false);
  const refl = makeFatLine(RAY_PINK, 4.2, false);
  const dash = makeFatLine(0x222222, 2.8, true);
  const ia = makeArrowMesh(RAY_PINK);
  const ra = makeArrowMesh(RAY_PINK);
  rayState.group.add(inc, refl, dash, ia, ra);
  rayState.inc.push(inc);
  rayState.refl.push(refl);
  rayState.dash.push(dash);
  rayState.incArrows.push(ia);
  rayState.reflArrows.push(ra);
}
rayState.glassBar = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({
    color: 0x8eb8d4,
    transparent: true,
    opacity: 0.92,
    depthTest: false,
    side: THREE.DoubleSide,
  })
);
rayState.glassBar.renderOrder = 4;
rayState.group.add(rayState.eye, rayState.labelS, rayState.labelSp, rayState.glassBar);
rayState.ghost = makeDashedGhostCandle();

function updateRayDiagram() {
  const show = state.viewMode === 'side';
  rayState.group.visible = show;
  rayState.ghost.visible = show;
  if (!show) return;

  const S = litFlameTipWorld();
  const Sp = mirrorPoint(S);
  const plane = getFrontMirrorPlane();

  const eye = new THREE.Vector3(
    Math.min(S.x, litCandle.position.x) - 0.5,
    0.73,
    S.z
  );
  rayState.eye.position.copy(eye);
  rayState.labelS.position.set(S.x - 0.05, S.y + 0.055, S.z);
  rayState.labelSp.position.set(Sp.x + 0.06, Sp.y + 0.05, Sp.z);
  rayState.labelS.quaternion.copy(camera.quaternion);
  rayState.labelSp.quaternion.copy(camera.quaternion);

  const thick = Math.max(0.022, currentThickness() * 1.15);
  rayState.glassBar.scale.set(thick, MIRROR_H, 1);
  rayState.glassBar.position.set(getMirrorCenterX(), MIRROR_H / 2, S.z);
  rayState.glassBar.rotation.set(0, 0, mirrorGroup.rotation.z);

  const yHits = [
    THREE.MathUtils.clamp(S.y + 0.08, 0.32, MIRROR_H * 0.48),
    THREE.MathUtils.clamp(S.y + 0.16, 0.38, MIRROR_H * 0.58),
    THREE.MathUtils.clamp(S.y + 0.24, 0.46, MIRROR_H * 0.66),
  ];

  for (let i = 0; i < RAY_COUNT; i++) {
    const cand = new THREE.Vector3(mirrorGroup.position.x, yHits[i], S.z);
    const hit = new THREE.Vector3();
    plane.projectPoint(cand, hit);
    const ok = hit.y > S.y + 0.04 && hit.y < MIRROR_H * 0.92;
    if (!ok) {
      setFatLine(rayState.inc[i], S, S, false);
      setFatLine(rayState.refl[i], S, S, false);
      setFatLine(rayState.dash[i], S, S, false);
      placeArrow(rayState.incArrows[i], S, S, 0.5, false);
      placeArrow(rayState.reflArrows[i], S, S, 0.5, false);
      continue;
    }
    const dir = hit.clone().sub(Sp);
    if (dir.lengthSq() < 1e-8) continue;
    dir.normalize();
    const beyond = hit.clone().addScaledVector(dir, 0.62);
    setFatLine(rayState.inc[i], S, hit, true);
    setFatLine(rayState.refl[i], hit, beyond, true);
    setFatLine(rayState.dash[i], Sp, hit, true);
    placeArrow(rayState.incArrows[i], S, hit, 0.42, true);
    placeArrow(rayState.reflArrows[i], hit, beyond, 0.42, true);
  }

  const base = litBaseWorld();
  const imgBase = mirrorPoint(base);
  rayState.ghost.position.copy(imgBase);
  const imgTipBody = mirrorPoint(new THREE.Vector3(base.x, BODY_H, base.z));
  const up = imgTipBody.clone().sub(imgBase);
  if (up.lengthSq() > 1e-8) {
    rayState.ghost.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up.normalize());
  } else {
    rayState.ghost.quaternion.identity();
  }
}

/* —— 物高 / 像高（机械制图：尺寸界线 + 尺寸线 + 双向箭头） —— */
const DIM_COLOR = 0xdc2626;
const DIM_LINE_W = 0.0064;
const EXT_LINE_W = 0.005;
const DIM_GAP = 0.038;
const DIM_OUT = 0.11;
const EXT_OVER = 0.014;

const dimLabelScene = new THREE.Scene();

function makeDimension() {
  const g = new THREE.Group();
  const extTop = makeFatLine(DIM_COLOR, EXT_LINE_W, false, true);
  const extBot = makeFatLine(DIM_COLOR, EXT_LINE_W, false, true);
  const line = makeFatLine(DIM_COLOR, DIM_LINE_W, false, true);
  const top = makeArrowMesh(DIM_COLOR, DIM_CONE_H);
  const bot = makeArrowMesh(DIM_COLOR, DIM_CONE_H);
  const label = makeVectorText('0.0 cm', DIM_COLOR, 0.034);
  g.add(extTop, extBot, line, top, bot);
  dimLabelScene.add(label);
  g.userData = { extTop, extBot, line, top, bot, label };
  heightViz.group.add(g);
  return g;
}

const heightViz = {
  group: new THREE.Group(),
  obj: null,
  img: null,
};
overlayRoot.add(heightViz.group);
heightViz.obj = makeDimension();
heightViz.img = makeDimension();
heightViz.group.visible = false;
rayState.group.visible = false;

function layoutDimension(dim, cx, cz, y0, y1, sign) {
  const xStart = cx + sign * DIM_GAP;
  const xDim = cx + sign * (DIM_GAP + DIM_OUT);
  const xEnd = xDim + sign * EXT_OVER;
  setFatLine(dim.userData.extBot, new THREE.Vector3(xStart, y0, cz), new THREE.Vector3(xEnd, y0, cz), true);
  setFatLine(dim.userData.extTop, new THREE.Vector3(xStart, y1, cz), new THREE.Vector3(xEnd, y1, cz), true);
  const p0 = new THREE.Vector3(xDim, y0, cz);
  const p1 = new THREE.Vector3(xDim, y1, cz);
  setFatLine(dim.userData.line, p0, p1, true);
  const up = new THREE.Vector3(0, 1, 0);
  const dn = new THREE.Vector3(0, -1, 0);
  dim.userData.top.quaternion.setFromUnitVectors(up, up);
  dim.userData.top.position.copy(p1).addScaledVector(up, -DIM_CONE_H / 2);
  dim.userData.bot.quaternion.setFromUnitVectors(up, dn);
  dim.userData.bot.position.copy(p0).addScaledVector(dn, -DIM_CONE_H / 2);
  const mid = (y0 + y1) / 2;
  let halfW = 0.072;
  const mesh = dim.userData.label.userData.mesh;
  if (mesh) {
    if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
    const bb = mesh.geometry.boundingBox;
    halfW = Math.max(halfW, (bb.max.x - bb.min.x) / 2);
  }
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  right.y = 0;
  if (right.lengthSq() < 1e-8) right.set(sign, 0, 0);
  else right.normalize();
  if (right.x * sign < 0) right.negate();
  dim.userData.label.position.set(xDim, mid, cz).addScaledVector(right, halfW + 0.034);
  dim.userData.label.lookAt(camera.position.x, mid, camera.position.z);
  dim.userData.label.visible = true;
}

function updateHeightMeasure() {
  const base = litBaseWorld();
  const tip = new THREE.Vector3(base.x, VISUAL_TIP_Y, base.z);
  const imgBase = mirrorPoint(base);
  const imgTip = mirrorPoint(tip);

  const dx = unlitCandle.position.x - imgBase.x;
  const dz = unlitCandle.position.z - imgBase.z;
  const coincide = !isTilted() && Math.hypot(dx, dz) < COINCIDE_R;
  state.coincided = coincide;

  const waitEl = document.getElementById('size-wait');
  const numsEl = document.getElementById('size-nums');
  if (isTilted()) {
    waitEl.hidden = false;
    waitEl.textContent = '镜面已倾斜，像离开桌面，无法用未燃烛重合测高';
    numsEl.hidden = true;
    heightViz.group.visible = false;
    heightViz.obj.userData.label.visible = false;
    heightViz.img.userData.label.visible = false;
    return;
  }

  if (!coincide) {
    waitEl.hidden = false;
    waitEl.textContent = '将未燃蜡烛移到与像重合处，自动读出物高与像高';
    numsEl.hidden = true;
    heightViz.group.visible = false;
    heightViz.obj.userData.label.visible = false;
    heightViz.img.userData.label.visible = false;
    return;
  }

  const h = tip.y / CM;
  const hp = imgBase.distanceTo(imgTip) / CM;
  const ratio = h > 1e-4 ? hp / h : 0;
  const hTxt = `${h.toFixed(1)} cm`;
  const hpTxt = `${hp.toFixed(1)} cm`;
  document.getElementById('h-obj').textContent = hTxt;
  document.getElementById('h-img').textContent = hpTxt;
  document.getElementById('h-ratio').textContent = ratio.toFixed(2);
  const judge = document.getElementById('h-judge');
  if (Math.abs(ratio - 1) < 0.08) {
    judge.textContent = 'h′ ≈ h，像与物等大';
    judge.className = 'eq';
  } else if (ratio > 1) {
    judge.textContent = 'h′ > h，像放大';
    judge.className = 'eq';
  } else {
    judge.textContent = 'h′ < h，像缩小';
    judge.className = 'eq';
  }
  waitEl.hidden = true;
  numsEl.hidden = false;

  heightViz.group.visible = true;
  heightViz.obj.visible = true;
  heightViz.img.visible = true;
  layoutDimension(heightViz.obj, base.x, base.z, 0.002, tip.y, -1);
  layoutDimension(heightViz.img, imgBase.x, imgBase.z, imgBase.y + 0.002, imgTip.y, 1);
  setVectorText(heightViz.obj.userData.label, hTxt);
  setVectorText(heightViz.img.userData.label, hpTxt);
}

/* —— 绘制 —— */
function makeCrosshair(color) {
  const g = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({ color });
  const s = 0.035;
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-s, 0, 0), new THREE.Vector3(s, 0, 0),
  ]), mat));
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, -s), new THREE.Vector3(0, 0, s),
  ]), mat));
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.012, 0.016, 24),
    new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  g.add(ring);
  return g;
}

function makeInkCircle(x, z) {
  const pts = [];
  const segs = 48;
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    pts.push(new THREE.Vector3(x + Math.cos(a) * CIRCLE_R, 0.001, z + Math.sin(a) * CIRCLE_R));
  }
  return new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x111827 })
  );
}

function makeLabelSprite(text, color = '#3b82f6') {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.font = '600 28px "Noto Sans SC", sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  spr.scale.set(0.28, 0.07, 1);
  return spr;
}

function createPencil() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.004, 0.005, 0.11, 8),
    new THREE.MeshStandardMaterial({ color: 0xc4a35a, roughness: 0.7 })
  );
  body.position.y = 0.07;
  const tip = new THREE.Mesh(
    new THREE.ConeGeometry(0.005, 0.022, 8),
    new THREE.MeshStandardMaterial({ color: 0x5c4030, roughness: 0.6 })
  );
  tip.position.y = 0.009;
  tip.rotation.x = Math.PI;
  const lead = new THREE.Mesh(
    new THREE.ConeGeometry(0.0018, 0.01, 6),
    new THREE.MeshBasicMaterial({ color: 0x1a1a1a })
  );
  lead.position.y = -0.002;
  lead.rotation.x = Math.PI;
  g.add(body, tip, lead);
  g.rotation.z = -0.55;
  g.visible = false;
  scene.add(g);
  return g;
}

const drawPencil = createPencil();
let pencilAnim = null; // { cx, cz, start, trail, kind, color, labelPrefix }

function disposeObject3D(obj) {
  if (!obj) return;
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
}

function finalizeCircleMark(cx, cz, kind) {
  const isObj = kind === 'object';
  const color = isObj ? 0x2563eb : 0xdc2626;
  const css = isObj ? '#2563eb' : '#dc2626';
  const list = isObj ? marks.objects : marks.images;
  const prefix = isObj ? '物' : '像';

  const circle = makeInkCircle(cx, cz);
  drawRoot.add(circle);
  const mesh = makeCrosshair(color);
  mesh.position.set(cx, 0, cz);
  drawRoot.add(mesh);
  const n = list.length + 1;
  const label = makeLabelSprite(`${prefix}${n}`, css);
  label.position.set(cx, 0.02, cz + CIRCLE_R + 0.02);
  drawRoot.add(label);

  const entry = {
    id: markIdSeq++,
    kind,
    mesh,
    label,
    circle,
    x: cx,
    z: cz,
  };
  list.push(entry);
  refreshMeasureLines();
  return entry;
}

function startPencilMark(kind) {
  const candle = kind === 'object' ? litCandle : unlitCandle;
  if (kind === 'image' && isTilted()) {
    showTip('镜面已倾斜，像离开桌面，不能点像的位置');
    return;
  }
  const cx = candle.position.x;
  const cz = candle.position.z;
  state.markQueue.push({ kind, cx, cz });
  pumpMarkQueue();
}

function pumpMarkQueue() {
  if (state.pencilBusy || !state.markQueue.length) return;
  const job = state.markQueue.shift();
  state.pencilBusy = true;

  const trailPts = [];
  const trailGeo = new THREE.BufferGeometry();
  const trail = new THREE.Line(
    trailGeo,
    new THREE.LineBasicMaterial({ color: 0x111827 })
  );
  drawRoot.add(trail);

  const start = performance.now();
  const duration = 600;
  pencilAnim = { job, trail, trailPts, trailGeo, start, duration };

  drawPencil.visible = true;
  showTip(job.kind === 'object' ? '正在标记物的位置…' : '正在标记像的位置…', 800);
}

function updatePencilAnim(now) {
  if (!pencilAnim) return;
  const { job, trail, trailPts, trailGeo, start, duration } = pencilAnim;
  const t = Math.min(1, (now - start) / duration);
  const angle = t * Math.PI * 2;
  const px = job.cx + Math.cos(angle) * CIRCLE_R;
  const pz = job.cz + Math.sin(angle) * CIRCLE_R;

  drawPencil.position.set(px, 0.02, pz);
  drawPencil.rotation.y = -angle + Math.PI / 2;

  trailPts.push(new THREE.Vector3(px, 0.0015, pz));
  trailGeo.setFromPoints(trailPts);
  trailGeo.attributes.position.needsUpdate = true;

  if (t >= 1) {
    drawRoot.remove(trail);
    disposeObject3D(trail);
    drawPencil.visible = false;
    pencilAnim = null;
    finalizeCircleMark(job.cx, job.cz, job.kind);
    state.pencilBusy = false;
    showTip(job.kind === 'object' ? '已标记物的位置' : '已标记像的位置');
    pumpMarkQueue();
  }
}

function cancelPencilAnim() {
  state.markQueue = [];
  if (pencilAnim) {
    drawRoot.remove(pencilAnim.trail);
    disposeObject3D(pencilAnim.trail);
    pencilAnim = null;
  }
  drawPencil.visible = false;
  state.pencilBusy = false;
}

function setMirrorLine() {
  if (marks.mirrorLine) {
    drawRoot.remove(marks.mirrorLine);
    disposeObject3D(marks.mirrorLine);
    marks.mirrorLine = null;
  }
  const mx = getMirrorCenterX();
  const halfZ = (PAPER_D * CM) / 2 - 0.02;
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(mx, 0, -halfZ), new THREE.Vector3(mx, 0, halfZ),
    ]),
    new THREE.LineBasicMaterial({ color: 0x111827 })
  );
  const label = makeLabelSprite('镜', '#111827');
  label.position.set(mx + 0.05, 0.02, halfZ - 0.05);
  const g = new THREE.Group();
  g.add(line, label);
  g.userData.kind = 'mirrorLine';
  drawRoot.add(g);
  marks.mirrorLine = g;
  refreshMeasureLines();
}

function clearMeasureVisuals() {
  marks.measures.forEach(m => {
    drawRoot.remove(m.group);
    disposeObject3D(m.group);
  });
  marks.measures = [];
}

function removeMarkEntry(entry) {
  drawRoot.remove(entry.mesh);
  drawRoot.remove(entry.label);
  if (entry.circle) drawRoot.remove(entry.circle);
  disposeObject3D(entry.mesh);
  disposeObject3D(entry.label);
  disposeObject3D(entry.circle);
}

function clearDrawings() {
  cancelPencilAnim();
  [...marks.objects, ...marks.images].forEach(removeMarkEntry);
  marks.objects = [];
  marks.images = [];
  if (marks.mirrorLine) {
    drawRoot.remove(marks.mirrorLine);
    disposeObject3D(marks.mirrorLine);
    marks.mirrorLine = null;
  }
  clearMeasureVisuals();
  marks.rulers.forEach(r => {
    drawRoot.remove(r.group);
    disposeObject3D(r.group);
  });
  marks.rulers = [];
  state.rulerFirst = null;
}

function distCm(a, b) {
  return Math.hypot(a.x - b.x, a.z - b.z) / CM;
}

function allMarkCenters() {
  return [...marks.objects, ...marks.images];
}

function nearestMarkCenter(x, z, maxDist = SNAP_R) {
  let best = null;
  let bestD = maxDist;
  allMarkCenters().forEach(m => {
    const d = Math.hypot(m.x - x, m.z - z);
    if (d < bestD) {
      bestD = d;
      best = m;
    }
  });
  return best;
}

function refreshMeasureLines() {
  clearMeasureVisuals();
  if (state.drawMode !== 'measure' || !marks.mirrorLine) return;
  const mx = getMirrorCenterX();
  const corner = 0.7 * CM;

  const addPerp = (mark, colorHex, cssColor) => {
    const group = new THREE.Group();
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(mark.x, 0.001, mark.z),
      new THREE.Vector3(mx, 0.001, mark.z),
    ]);
    const line = new THREE.Line(geo, new THREE.LineDashedMaterial({
      color: colorHex, dashSize: 0.02, gapSize: 0.012,
    }));
    line.computeLineDistances();
    group.add(line);

    // 垂足直角符号：开口朝向标记一侧
    const sx = mark.x < mx ? -1 : 1;
    const cornerPts = [
      new THREE.Vector3(mx + sx * corner, 0.0015, mark.z),
      new THREE.Vector3(mx + sx * corner, 0.0015, mark.z + corner),
      new THREE.Vector3(mx, 0.0015, mark.z + corner),
    ];
    group.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(cornerPts),
      new THREE.LineBasicMaterial({ color: colorHex })
    ));

    const d = Math.abs(mark.x - mx) / CM;
    const spr = makeLabelSprite(`${d.toFixed(1)} cm`, cssColor);
    spr.position.set((mark.x + mx) / 2, 0.03, mark.z + 0.03);
    group.add(spr);
    drawRoot.add(group);
    marks.measures.push({ group });
  };

  marks.objects.forEach(m => addPerp(m, 0x2563eb, '#2563eb'));
  marks.images.forEach(m => addPerp(m, 0xdc2626, '#dc2626'));
}

function addRuler(a, b) {
  const group = new THREE.Group();
  group.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(a.x, 0.002, a.z),
      new THREE.Vector3(b.x, 0.002, b.z),
    ]),
    new THREE.LineBasicMaterial({ color: 0x16a34a })
  ));
  const spr = makeLabelSprite(`${distCm(a, b).toFixed(1)} cm`, '#16a34a');
  spr.position.set((a.x + b.x) / 2, 0.035, (a.z + b.z) / 2);
  group.add(spr);
  [a, b].forEach(p => {
    const dot = new THREE.Mesh(
      new THREE.CircleGeometry(0.01, 12),
      new THREE.MeshBasicMaterial({ color: 0x16a34a, side: THREE.DoubleSide })
    );
    dot.rotation.x = -Math.PI / 2;
    dot.position.set(p.x, 0.002, p.z);
    group.add(dot);
  });
  drawRoot.add(group);
  marks.rulers.push({
    id: markIdSeq++,
    group,
    a: { x: a.x, z: a.z },
    b: { x: b.x, z: b.z },
  });
}

/** 擦除：点中某条绘制则只删这一条 */
function eraseAt(x, z) {
  const hitMark = nearestMarkCenter(x, z, CIRCLE_R * 1.4);
  if (hitMark) {
    const list = hitMark.kind === 'object' ? marks.objects : marks.images;
    const idx = list.indexOf(hitMark);
    if (idx >= 0) list.splice(idx, 1);
    removeMarkEntry(hitMark);
    refreshMeasureLines();
    showTip('已擦除该标记');
    return true;
  }

  if (marks.mirrorLine) {
    const mx = getMirrorCenterX();
    if (Math.abs(x - mx) < 0.04) {
      drawRoot.remove(marks.mirrorLine);
      disposeObject3D(marks.mirrorLine);
      marks.mirrorLine = null;
      refreshMeasureLines();
      showTip('已擦除平面镜位置线');
      return true;
    }
  }

  for (let i = marks.rulers.length - 1; i >= 0; i--) {
    const r = marks.rulers[i];
    const dist = distPointToSegment(x, z, r.a.x, r.a.z, r.b.x, r.b.z);
    if (dist < 0.035) {
      drawRoot.remove(r.group);
      disposeObject3D(r.group);
      marks.rulers.splice(i, 1);
      showTip('已擦除该尺子');
      return true;
    }
  }

  showTip('请点中要擦除的圈、镜迹或尺子');
  return false;
}

function distPointToSegment(px, pz, ax, az, bx, bz) {
  const dx = bx - ax;
  const dz = bz - az;
  const len2 = dx * dx + dz * dz;
  if (len2 < 1e-10) return Math.hypot(px - ax, pz - az);
  let t = ((px - ax) * dx + (pz - az) * dz) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), pz - (az + t * dz));
}

/* —— 交互 —— */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const hitPoint = new THREE.Vector3();

function setPointer(e) {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
}

function rayToPaper(e) {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  return raycaster.ray.intersectPlane(paperPlane, hitPoint) ? hitPoint.clone() : null;
}

function rayToInteract(e) {
  if (state.viewMode !== 'side') return rayToPaper(e);
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const z0 = state.dragging?.type === 'unlit' ? unlitCandle.position.z : litCandle.position.z;
  const sidePlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -z0);
  return raycaster.ray.intersectPlane(sidePlane, hitPoint) ? hitPoint.clone() : null;
}

function pickDraggable(e) {
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const roots = [litCandle, unlitCandle, screenGroup];
  if (!state.fixMirror) roots.push(mirrorGroup);
  const meshes = [];
  roots.forEach(r => r.traverse(o => { if (o.isMesh) meshes.push(o); }));
  const hits = raycaster.intersectObjects(meshes, false);
  if (!hits.length) return null;
  let obj = hits[0].object;
  while (obj) {
    if (obj === litCandle) return 'lit';
    if (obj === unlitCandle) return 'unlit';
    if (obj === screenGroup) return 'screen';
    if (obj === mirrorGroup) return 'mirror';
    obj = obj.parent;
  }
  return null;
}

function showTip(text, ms = 2200) {
  tipEl.textContent = text;
  tipEl.classList.add('show');
  clearTimeout(showTip._t);
  showTip._t = setTimeout(() => tipEl.classList.remove('show'), ms);
}

function updateImageToolEnabled() {
  const imgBtn = document.querySelector('[data-tool="image"]');
  imgBtn.disabled = isTilted();
  if (isTilted() && state.tool === 'image') {
    state.tool = null;
  }
  syncToolButtons();
}

function syncToolButtons() {
  document.querySelectorAll('#tool-group .btn').forEach(btn => {
    const tool = btn.dataset.tool;
    btn.disabled = (tool === 'ruler' && state.drawMode !== 'measure') || (tool === 'image' && isTilted());
    btn.classList.toggle('active', state.tool === tool && !btn.disabled);
  });
}

function updateModeUI() {
  document.querySelectorAll('#mode-group .btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === state.drawMode);
  });
  if (state.drawMode === 'point' && state.tool === 'ruler') {
    state.tool = null;
    state.rulerFirst = null;
  }
  if (state.drawMode === 'measure' && (state.tool === 'object' || state.tool === 'image' || state.tool === 'mirrorLine')) {
    // 测距模式下仍可用擦除；点点工具切模式时清掉
  }
  syncToolButtons();
  refreshMeasureLines();
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;

  if (state.tool) {
    const p = rayToPaper(e);
    if (!p) return;
    clampToPaper(p);

    if (state.tool === 'erase') {
      eraseAt(p.x, p.z);
      return;
    }
    if (state.tool === 'object') {
      startPencilMark('object');
      return;
    }
    if (state.tool === 'image') {
      startPencilMark('image');
      return;
    }
    if (state.tool === 'mirrorLine') {
      setMirrorLine();
      showTip('已画出平面镜（厚度中心）位置');
      return;
    }
    if (state.tool === 'ruler') {
      const snap = nearestMarkCenter(p.x, p.z);
      if (!snap) {
        showTip('请点中已有准星的中心');
        return;
      }
      if (!state.rulerFirst) {
        state.rulerFirst = { x: snap.x, z: snap.z };
        showTip('再点另一个准星中心完成测距');
      } else {
        if (Math.hypot(snap.x - state.rulerFirst.x, snap.z - state.rulerFirst.z) < 0.001) {
          showTip('请选择另一个准星');
          return;
        }
        addRuler(state.rulerFirst, { x: snap.x, z: snap.z });
        state.rulerFirst = null;
        showTip('已量出两准星中心距离');
      }
      return;
    }
  }

  const kind = pickDraggable(e);
  if (!kind) return;
  const p = rayToInteract(e);
  if (!p) return;
  const target = kind === 'lit' ? litCandle
    : kind === 'unlit' ? unlitCandle
    : kind === 'screen' ? screenGroup
    : mirrorGroup;
  state.dragging = { type: kind, offset: new THREE.Vector3().subVectors(target.position, p) };
  controls.enabled = false;
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!state.dragging) return;
  const p = rayToInteract(e);
  if (!p) return;
  const pos = p.add(state.dragging.offset);
  pos.y = 0;
  clampToPaper(pos);
  if (state.dragging.type === 'lit') {
    litCandle.position.set(pos.x, 0, pos.z);
    clampLitCandle();
  } else if (state.dragging.type === 'unlit') {
    unlitCandle.position.set(pos.x, 0, pos.z);
    clampUnlitCandle();
  } else if (state.dragging.type === 'screen') {
    screenGroup.position.set(pos.x, 0, pos.z);
    clampScreen();
  } else if (state.dragging.type === 'mirror' && !state.fixMirror) {
    mirrorGroup.position.x = pos.x;
    mirrorGroup.position.z = pos.z;
    clampAllObjects();
    if (marks.mirrorLine) setMirrorLine();
  }
});

function endDrag() {
  state.dragging = null;
  controls.enabled = true;
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointerleave', endDrag);

/* UI */
document.querySelectorAll('#material-group .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.material = btn.dataset.material;
    document.querySelectorAll('#material-group .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyMaterialVisual();
  });
});
document.getElementById('fix-mirror').addEventListener('change', e => {
  state.fixMirror = e.target.checked;
});
document.getElementById('window-slide').addEventListener('input', e => {
  setWindowSlide(Number(e.target.value) / 100);
});
document.getElementById('paper-white').addEventListener('click', () => setPaperGrid(false));
document.getElementById('paper-grid').addEventListener('click', () => setPaperGrid(true));

const thicknessInput = document.getElementById('thickness');
const thicknessVal = document.getElementById('thickness-val');
thicknessInput.addEventListener('input', () => {
  state.thickness = Number(thicknessInput.value) / 100;
  const mm = (currentThickness() / CM) * 10;
  thicknessVal.textContent = mm >= 9.95 ? '1.0 cm' : `${mm.toFixed(1)} mm`;
  updateMirrorTransform();
  if (marks.mirrorLine) setMirrorLine();
});

const tiltInput = document.getElementById('tilt');
const tiltVal = document.getElementById('tilt-val');
tiltInput.addEventListener('input', () => {
  state.tiltDeg = Number(tiltInput.value);
  tiltVal.textContent = `${state.tiltDeg}°`;
  updateMirrorTransform();
});

document.querySelectorAll('#mode-group .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.drawMode = btn.dataset.mode;
    state.tool = null;
    state.rulerFirst = null;
    updateModeUI();
  });
});

document.querySelectorAll('#tool-group .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.disabled) return;
    const tool = btn.dataset.tool;
    state.tool = state.tool === tool ? null : tool;
    state.rulerFirst = null;
    syncToolButtons();
    const tips = {
      object: '点击白纸：铅笔将绕燃烛底部画圈并出十字准星',
      image: '点击白纸：铅笔将绕未燃烛底部画圈并出十字准星',
      mirrorLine: '点击后在镜面厚度中心画线',
      ruler: '依次点中两个准星中心，量出距离',
      erase: '点中某一圈、镜迹或尺子即可单独擦除',
    };
    if (state.tool) showTip(tips[state.tool]);
  });
});

document.getElementById('clear-draw').addEventListener('click', () => {
  clearDrawings();
  showTip('已清除全部绘制');
});

function applyTopViewCamera() {
  const f = makeOrthoFrustum();
  orthoCamera.left = f.left;
  orthoCamera.right = f.right;
  orthoCamera.top = f.top;
  orthoCamera.bottom = f.bottom;
  orthoCamera.zoom = 1;
  orthoCamera.position.set(0, 6, 0);
  orthoCamera.up.set(0, 0, -1);
  orthoCamera.lookAt(0, 0, 0);
  orthoCamera.updateProjectionMatrix();
  controls.target.set(0, 0, 0);
  controls.update();
}

function makeSideFrustum() {
  const aspect = innerWidth / Math.max(1, innerHeight);
  const worldTop = 0.88;
  const worldBottom = -0.08;
  const halfH = (worldTop - worldBottom) / 2;
  const cy = (worldTop + worldBottom) / 2;
  const halfW = Math.max(TABLE_HALF_W + 0.55, halfH * aspect);
  return { left: -halfW, right: halfW, top: halfH, bottom: -halfH, cy };
}

function applySideViewCamera() {
  const f = makeSideFrustum();
  orthoCamera.left = f.left;
  orthoCamera.right = f.right;
  orthoCamera.top = f.top;
  orthoCamera.bottom = f.bottom;
  orthoCamera.zoom = 1;
  orthoCamera.position.set(0, f.cy, 4.2);
  orthoCamera.up.set(0, 1, 0);
  orthoCamera.lookAt(0, f.cy, 0);
  orthoCamera.updateProjectionMatrix();
  controls.target.set(0, f.cy, 0);
  controls.update();
}

function applyObliqueCamera() {
  camera = perspCamera;
  controls.object = perspCamera;
  controls.enableRotate = true;
  controls.minPolarAngle = 0;
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.minDistance = 1.4;
  controls.maxDistance = 8;
  perspCamera.position.copy(OBLIQUE_POS);
  perspCamera.up.set(0, 1, 0);
  controls.target.copy(OBLIQUE_TARGET);
  controls.update();
}

function useOrthoControls() {
  camera = orthoCamera;
  controls.object = orthoCamera;
  controls.enableRotate = false;
  controls.enablePan = true;
  controls.enableZoom = true;
  controls.minPolarAngle = 0;
  controls.maxPolarAngle = Math.PI;
}

function syncViewButtons() {
  document.querySelectorAll('#view-group .btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === state.viewMode);
  });
}

function resetCurrentView() {
  if (state.viewMode === 'top') applyTopViewCamera();
  else if (state.viewMode === 'side') applySideViewCamera();
  else applyObliqueCamera();
}

function setViewMode(mode) {
  state.viewMode = mode;
  syncViewButtons();
  room.visible = mode !== 'side';
  screenGroup.visible = mode !== 'side';
  supportA.visible = mode !== 'side';
  supportB.visible = mode !== 'side';
  if (mode === 'side') {
    scene.background.set(0xeef1f6);
    scene.fog = null;
  } else {
    scene.background.set(0x66686a);
    scene.fog = null;
  }

  if (mode === 'top') {
    useOrthoControls();
    applyTopViewCamera();
    showTip('俯视：查看桌面测距；光路请切到侧视', 2200);
  } else if (mode === 'side') {
    useOrthoControls();
    applySideViewCamera();
    showTip('侧视：平面镜成像光路（虚像 S′）', 2400);
  } else {
    applyObliqueCamera();
    showTip('斜视：可旋转观察；推窗请在此视角操作', 2200);
  }
}

document.querySelectorAll('#view-group .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.view;
    if (mode === state.viewMode) {
      resetCurrentView();
      return;
    }
    setViewMode(mode);
  });
});

document.getElementById('reset-cam').addEventListener('click', () => {
  resetCurrentView();
});

addEventListener('resize', () => {
  const aspect = innerWidth / Math.max(1, innerHeight);
  perspCamera.aspect = aspect;
  perspCamera.updateProjectionMatrix();
  if (state.viewMode === 'top' || state.viewMode === 'side') {
    const z = orthoCamera.zoom;
    if (state.viewMode === 'top') {
      const f = makeOrthoFrustum();
      orthoCamera.left = f.left;
      orthoCamera.right = f.right;
      orthoCamera.top = f.top;
      orthoCamera.bottom = f.bottom;
    } else {
      const f = makeSideFrustum();
      orthoCamera.left = f.left;
      orthoCamera.right = f.right;
      orthoCamera.top = f.top;
      orthoCamera.bottom = f.bottom;
    }
    orthoCamera.zoom = z;
    orthoCamera.updateProjectionMatrix();
  }
  renderer.setPixelRatio(Math.min(Math.max(devicePixelRatio, 1.5), 2));
  renderer.setSize(innerWidth, innerHeight);
  for (const r of [frontReflector,backReflector]) r.getRenderTarget().setSize(
    Math.floor(Math.min(2048,innerWidth*renderer.getPixelRatio())),
    Math.floor(Math.min(2048,innerHeight*renderer.getPixelRatio())));
  fatLineMats.forEach(m => m.resolution.set(innerWidth, innerHeight));
});

const clock = new THREE.Clock();
function animateFlame(t) {
  const mats = litCandle.userData.flameMats || [];
  mats.forEach(m => { m.uniforms.uTime.value = t; });
  const light = litCandle.userData.light;
  if (light) light.intensity = 0.12 + Math.sin(t * 18.5) * 0.012 + Math.sin(t * 31) * 0.006;
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  animateFlame(t);
  updatePencilAnim(performance.now());
  updateRayDiagram();
  updateHeightMeasure();
  controls.update();
  renderer.render(scene, camera);
  if (heightViz.group.visible) {
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(dimLabelScene, camera);
    renderer.autoClear = true;
  }
}

state.thickness = Number(thicknessInput.value) / 100;
updateMirrorTransform();
updateModeUI();
syncWindowSlider();
showTip('玻璃已固定。可推窗、切换侧视看光路，或把未燃烛移到像处比较高度', 3800);
animate();
  </script>

<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动圈式话筒 · 3D 结构观察</title><link rel="stylesheet" href="../shared/audio-model.css"></head>
<body data-model="microphone">
<main id="stage"><canvas id="scene" aria-label="动圈式话筒可旋转三维模型"></canvas><header class="head"><h1>动圈式话筒</h1><p>声信号 → 膜片与动圈 → 电信号</p><span class="badge" id="modeBadge">半剖面 · 磁隙和音圈可见</span></header><svg id="leaders" aria-hidden="true"></svg><div id="labels"></div>
<div class="legend"><span><i style="background:#df5848"></i>负载回路中的感应电流</span><span><i style="background:#2d82d1"></i>磁场</span><br>拖拽旋转 · 滚轮缩放 · Shift + 拖拽平移 · 点击部件</div>
<nav class="guide" id="guide" aria-label="观察步骤"><button data-step="0">1 看外观</button><button data-step="1" class="active">2 看磁隙</button><button data-step="2">3 看装配</button><button data-step="3">4 看工作</button></nav><div id="error" class="error" hidden></div></main>
<button id="openPanel" aria-label="展开控制面板">控制面板</button>
<aside id="panel"><button class="close-panel" id="closePanel" aria-label="收起控制面板">收起</button><h2>结构观察</h2><div id="views" class="seg"><button data-view="full">完整装配</button><button data-view="section" class="active">半剖面</button><button data-view="explode">分解</button></div><div class="tools"><button id="btnResetView">默认视角</button><button id="btnSide">正侧视图</button><button id="btnShot">导出图片</button></div>
<section class="group"><h3>选择部件</h3><div id="parts" class="parts"></div><div class="description" id="description" aria-live="polite"></div><div class="tools"><button id="btnFocus">放大所选部件</button><button id="btnLabels" class="active" aria-pressed="true">结构标注</button></div></section>
<section class="group"><h3>工作演示</h3><div class="seg"><button id="btnPlay" class="active">暂停振动</button><button id="btnResetMotion">回到平衡位置</button></div><label class="row" for="ampRange"><span>声音振幅</span><output id="ampValue">55%</output></label><input id="ampRange" type="range" min="0" max="100" value="55"><label class="row" for="freqRange"><span>演示频率（慢放）</span><output id="freqValue">1.2 Hz</output></label><input id="freqRange" type="range" min="5" max="30" value="12"><div class="tools"><button id="btnFlow" class="active" aria-pressed="true">电流箭头</button><button id="btnField" class="active" aria-pressed="true">磁场方向</button></div><div class="stats"><div>膜片位置<strong id="xValue">平衡位置</strong></div><div>感应电压（相对值）<strong id="signalValue">接近 0</strong></div></div><canvas id="plot" width="300" height="96" aria-label="输入输出相位关系示意"></canvas><p id="workNote" class="note"></p><p class="note">振动幅度放大、频率放慢，数值为相对示意。输出电压与线圈运动速度对应；红色箭头按接入负载的闭合回路展示。</p></section>
<section class="group"><h3>观察重点</h3><p class="note">固定的磁体和极板围成磁隙；铜色音圈位于其中。膜片与线圈连在一起，由声音推动；网罩和外壳固定。</p><p class="note">结构参考：<a href="https://service.shure.com/articles/en_US/Knowledge/difference-between-a-dynamic-and-condenser-microphone" target="_blank" rel="noopener">Shure 动圈话筒原理</a>。模型为教学简化结构。</p></section></aside>
<script src="../shared/vendor/three-r144.min.js"></script>
<script src="../shared/material-finish.js?v=2.0-20261008"></script><script src="../shared/current-flow-style.js"></script><script src="../shared/audio-model.js"></script></body></html>

<body>
<div class="page">
<header><div><div class="kicker">初中物理 · 光现象</div><h1>一池两世界</h1><p>光的折射 · 海湾观测站</p></div><div class="stamp">3D 交互实验</div></header>
<main class="workspace" aria-label="海湾观测站实验区">
<nav class="tabs" role="tablist" aria-label="实验场景">
<button role="tab" data-mode="overview" aria-selected="true"><span class="num">00</span>海岛总览</button>
<button role="tab" data-mode="human" aria-selected="false"><span class="num">01</span>水面上下观察</button>
<button role="tab" data-mode="game" aria-selected="false"><span class="num">02</span>叉鱼挑战</button>
<button role="tab" data-mode="pencil" aria-selected="false"><span class="num">03</span>弯折的铅笔</button>
</nav>
<div id="stage" class="stage" tabindex="0" aria-label="三维实验画面">
<div class="hud"><div class="scene-info"><div id="sceneId" class="eyebrow"></div><strong id="viewName"></strong></div><svg id="opticalDiagram" class="optical-diagram" aria-hidden="true"><g id="imageInk"></g><g id="leaderInk"></g><g id="rayInk"></g></svg><div id="labels" class="labels"></div>
<div id="stationMap" class="station-map" hidden><button data-enter="human">01 木栈桥</button><button data-enter="game">02 浅湾</button><button data-enter="pencil">03 观测屋</button></div>
<div id="designReference" class="design-reference" hidden><img alt="晴日海湾观测站设计原图" data-src="../assets/refraction-island-design.webp"><button id="closeReference" type="button">返回三维海岛</button></div>
<div id="reticle" class="reticle" hidden>+</div>
<div id="gameHud" class="game-hud" hidden><div class="game-chip"><small>关卡 / 得分</small><strong id="gameScore"></strong></div><div class="game-chip"><small>剩余鱼叉</small><strong id="gameAmmo"></strong></div><div class="game-chip" id="gameTimerChip"><small>剩余时间</small><strong id="gameTimer"></strong></div></div>
<div id="gameFlash" class="game-flash" hidden aria-live="polite"></div>
<div id="gameCenter" class="game-center" hidden><div class="game-card"><div class="serial" id="gameCardIndex"></div><h3 id="gameCardTitle"></h3><p id="gameCardText"></p><button class="action primary" id="gameCardAction"></button></div></div>
<div id="hint" class="hint"><span></span></div></div>
<div class="failure" id="failure" role="alert" hidden>三维画面启动失败。请使用启用了 WebGL 的 Chrome 或 Edge 打开。</div></div>
<aside id="controls" aria-label="实验控制" tabindex="0"></aside></main>
<footer><span>光从物体出发，进入观察者的眼睛。</span><span>离线单文件 · 课堂观察</span></footer>

<script>
'use strict';
const $ = id => document.getElementById(id);
const T = THREE, V = (x=0,y=0,z=0) => new T.Vector3(x,y,z);
const stage=$('stage'), controls=$('controls'), labels=$('labels');
const N=1.333, clamp=T.MathUtils.clamp, rad=T.MathUtils.degToRad;
const camera=new T.PerspectiveCamera(39,1,.06,80);
let renderer;
try {
  renderer=new T.WebGLRenderer({alpha:true,antialias:true});
  renderer.setClearColor(0,0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.65));
  renderer.toneMapping=T.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.19;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
  renderer.localClippingEnabled=true;
  stage.prepend(renderer.domElement);
} catch(error) {
  $('failure').hidden=false;
  throw error;
}
const scene=new T.Scene();
scene.add(new T.HemisphereLight(0xf3fbff,0x908478,1.88));
const sun=new T.DirectionalLight(0xffecd0,2.62);
sun.position.set(-10,17,11);scene.add(sun);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:55});
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.normalBias=.035;sun.shadow.bias=-.00019;sun.shadow.autoUpdate=false;sun.shadow.needsUpdate=true;
const rim=new T.DirectionalLight(0xcceeff,.85);
rim.position.set(5,4,-6); scene.add(rim);

const optic={uOptic:{value:0},uEye:{value:V()},uWaterN:{value:N}};
function opticalMaterial(color, extra={}) {
  const material=new T.MeshStandardMaterial({color,roughness:.48,...extra});
  material.onBeforeCompile=shader=>{
    Object.assign(shader.uniforms,optic);
    shader.vertexShader=shader.vertexShader.replace('#include <common>',`#include <common>
      uniform float uOptic;
      uniform float uWaterN;
      uniform vec3 uEye;
      vec3 apparentPoint(vec3 p) {
        if(uOptic<0.5 || p.y*uEye.y>=0.0 || abs(p.y)<0.00001) return p;
        float d=length(p.xz-uEye.xz);
        float ne=uEye.y>0.0?1.0:uWaterN;
        float no=uEye.y>0.0?uWaterN:1.0;
        if(d<0.00001){p.y*=ne/no;return p;}
        float lo=0.0, hi=1.0;
        for(int i=0;i<23;i++){
          float s=(lo+hi)*0.5;
          float a=s*d, b=(1.0-s)*d;
          float f=ne*a/length(vec2(a,uEye.y))-no*b/length(vec2(b,p.y));
          if(f>0.0) hi=s; else lo=s;
        }
        p.y=uEye.y*(1.0-1.0/((lo+hi)*0.5));
        return p;
      }`);
    shader.vertexShader=shader.vertexShader.replace('#include <project_vertex>',`
      vec4 physicalPosition=vec4(transformed,1.0);
      #ifdef USE_INSTANCING
        physicalPosition=instanceMatrix*physicalPosition;
      #endif
      vec4 physicalWorld=modelMatrix*physicalPosition;
      vec4 mvPosition=viewMatrix*vec4(apparentPoint(physicalWorld.xyz),1.0);
      gl_Position=projectionMatrix*mvPosition;`);
  };
  return material;
}
function standard(color,extra={}) {return new T.MeshStandardMaterial({color,roughness:.68,...extra});}
function mesh(group,geo,mat,x=0,y=0,z=0) {
  const m=new T.Mesh(geo,mat); m.position.set(x,y,z); group.add(m); return m;
}
function ball(g,mat,x,y,z,sx,sy,sz,detail=20) {
  const m=mesh(g,new T.SphereGeometry(1,detail,12),mat,x,y,z); m.scale.set(sx,sy,sz); return m;
}
function box(g,mat,x,y,z,w,h,d) {return mesh(g,new T.BoxGeometry(w,h,d),mat,x,y,z);}
function cylinder(g,mat,a,b,r1,r2=r1,sides=16,segments=1) {
  const delta=b.clone().sub(a);
  const m=mesh(g,new T.CylinderGeometry(r2,r1,delta.length(),sides,segments),mat);
  m.position.copy(a).lerp(b,.5); m.quaternion.setFromUnitVectors(V(0,1),delta.normalize()); return m;
}
function ring(g,mat,r,t,y) {
  const m=mesh(g,new T.TorusGeometry(r,t,10,96),mat,0,y,0);m.rotation.x=Math.PI/2;return m;
}
let seed=23;
function random(){seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296;}
const pond=new T.Group(), studio=new T.Group();
scene.add(pond,studio);
function plant(group,x,y,z,s,mat,number) {
  for(let i=0;i<number;i++){
    const angle=random()*Math.PI*2, h=s*(.55+random()*.8);
    const vec=V(Math.cos(angle),0,Math.sin(angle)).multiplyScalar(h*.34);
    const a=V(x,y,z), b=a.clone().add(vec).add(V(0,h,0)), c=a.clone().addScaledVector(vec,.2).add(V(0,h*.56,0));
    const curve=new T.QuadraticBezierCurve3(a,c,b);
    mesh(group,new T.TubeGeometry(curve,5,s*.031,4,false),mat);
  }
}
const coastCenter=V(-2.1,0,0), coastRadius=11.75;
const coastWoodCanvas=document.createElement('canvas');
coastWoodCanvas.width=512;coastWoodCanvas.height=256;
const woodCtx=coastWoodCanvas.getContext('2d');
const baseWood=woodCtx.createLinearGradient(0,0,0,256);
baseWood.addColorStop(0,'#a67f5a');baseWood.addColorStop(.39,'#d0aa7b');baseWood.addColorStop(1,'#b2926b');
woodCtx.fillStyle=baseWood;woodCtx.fillRect(0,0,512,256);
for(let i=0;i<720;i++){
  const y=random()*256,x=random()*512,len=45+random()*280;
  woodCtx.strokeStyle=i%4===0?'#6c4a2d44':'#f9dfb74b';woodCtx.lineWidth=.25+random()*1.05;
  woodCtx.beginPath();woodCtx.moveTo(x,y);woodCtx.bezierCurveTo(x+len*.3,y+random()*2-1,x+len*.68,y-1,x+len,y);woodCtx.stroke();
}
const coastWoodTex=new T.CanvasTexture(coastWoodCanvas);coastWoodTex.colorSpace=T.SRGBColorSpace;coastWoodTex.anisotropy=4;
const deckWood=opticalMaterial(0xf0d5ad,{map:coastWoodTex,roughness:.86});
const wallWood=opticalMaterial(0xc8b18f,{map:coastWoodTex,roughness:.87});
const darkWood=opticalMaterial(0x65513d,{map:coastWoodTex,roughness:.94});
const stoneColors=[0x9c9787,0x827c6d,0xa5a08f,0xb3ab93,0x8d8b7b];
const labSite=V(-5.1,0,-5.45);
const stationPositions={human:V(-4.0,2.8,0),game:V(-.1,.68,2.9),pencil:V(-4.0,2.3,-6.0)};
const terrainGrain=document.createElement('canvas');terrainGrain.width=terrainGrain.height=128;
const grainCtx=terrainGrain.getContext('2d');
grainCtx.fillStyle='#c9c8bd';grainCtx.fillRect(0,0,128,128);
for(let i=0;i<7600;i++){
  grainCtx.fillStyle=['#716e604d','#f8f4df64','#a4a2928c'][i%3];
  grainCtx.fillRect(random()*128,random()*128,.3+random()*1.8,.3+random()*1.5);
}
const grainTex=new T.CanvasTexture(terrainGrain);grainTex.wrapS=grainTex.wrapT=T.RepeatWrapping;
grainTex.colorSpace=T.SRGBColorSpace;grainTex.anisotropy=4;
function coastShore(z){return -4.04+5.7*T.MathUtils.smoothstep(Math.abs(z),1.3,7.6)+.25*Math.sin(z*1.1);}
function coastHeight(x,z){
  const r=Math.hypot(x-coastCenter.x,z);

    if(!choices.length){el.hidden=true;leader.style.display='none';continue;}
    const box=choices.reduce((best,b)=>score(b)<score(best)?b:best);
    reserved.push(box);
    el.style.left=(box.x+4)+'px';el.style.top=(box.y+3)+'px';
    leader.style.display='';
    const near=[clamp(x,box.x,box.x+box.w),clamp(y,box.y,box.y+box.h)];
    const distance=Math.hypot(near[0]-x,near[1]-y);
    const start=distance>5?[x+(near[0]-x)*4/distance,y+(near[1]-y)*4/distance]:anchor;
    setLine(leader,start,near);

}
function renderDiagram(){
  if(!segments.length&&!points.length&&!outlines.length&&!currentTags.length)return;
  const width=stage.clientWidth,height=stage.clientHeight;
  diagramMatrix.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);
  if(!diagramDirty&&width===lastWidth&&height===lastHeight&&diagramMatrix.equals(lastDiagramMatrix))return;
  diagramDirty=false;lastWidth=width;lastHeight=height;lastDiagramMatrix.copy(diagramMatrix);
  diagram.setAttribute('viewBox',`0 0 ${width} ${height}`);
  for(const {vertices,node} of outlines){
    const poly=vertices.map(v=>projectedPoint(v,width,height));
    node.setAttribute('d',poly.every(Boolean)?'M'+poly.map(v=>v.join(',')).join('L')+'Z':'');
  }
  const ink=[];
  for(const {a,b,line,head} of segments){
    const segment=projectedSegment(a,b,width,height);
    line.style.display=segment?'':'none';
    if(head)head.style.display='none';
    if(!segment)continue;
    const [p,q]=segment;
    ink.push(segment);setLine(line,p,q);
    const dx=q[0]-p[0],dy=q[1]-p[1],length=Math.hypot(dx,dy);
    if(head&&length>=25){
      const ux=dx/length,uy=dy/length;
      const x=p[0]+dx*.58,y=p[1]+dy*.58;
      const size=width<530?12:16,half=width<530?4.3:5.7;
      const baseX=x-ux*size,baseY=y-uy*size;
      head.style.display='';
      head.setAttribute('points',[
        [x,y],[baseX-uy*half,baseY+ux*half],[x-ux*size*.70,y-uy*size*.70],[baseX+uy*half,baseY-ux*half]
      ].map(v=>v.join(',')).join(' '));
    }
  }
  for(const {p,node} of points){
    const q=projectedPoint(p,width,height);
    node.style.display=q?'':'none';
    if(q){node.setAttribute('cx',q[0]);node.setAttribute('cy',q[1]);}
  }
  layoutLabels(width,height,ink);
}

  }

    }

  }

function applyOrbit() {
  camera.fov=state.mode==='overview'?39:state.mode==='pencil'&&state.view==='eye'?43:39;
  camera.position.set(
    orbit.target.x+orbit.dist*Math.cos(orbit.elev)*Math.sin(orbit.az),
    orbit.target.y+orbit.dist*Math.sin(orbit.elev),
    orbit.target.z+orbit.dist*Math.cos(orbit.elev)*Math.cos(orbit.az)
  );
  const aim=orbit.target.clone();
  if(pondObservation()){
    const y=camera.position.y;
    // Ease into the pond footprint, then keep the orbit above the bed and out of the bank.
    const dive=1-T.MathUtils.smoothstep(y,0,1.5);
    const pondX=.90, dx=camera.position.x-pondX, dz=camera.position.z;
    const scale=Math.max(1,Math.hypot(dx/4.12,dz/3.04));
    camera.position.x=T.MathUtils.lerp(camera.position.x,pondX+dx/scale,dive);
    camera.position.z=T.MathUtils.lerp(camera.position.z,dz/scale,dive);
    if(y<0)camera.position.y=-2.32*(1-Math.exp(y/2.32));
    // As the camera enters the water, tip the view up toward the bank.
    const eye=camera.position.clone();eye.y=Math.min(-.08,eye.y);

    const upward=personEyeMark.clone().lerp(seen,.40);

    camera.fov=46;

  camera.lookAt(aim);camera.updateProjectionMatrix();camera.updateMatrixWorld();

  else updatePencilCameraOptics();

  }
  if(state.view==='eye'&&!pencilMode){updateOptics();applyEyeCamera();return;}
  orbit.target.copy(pencilMode?V(0,-.29,0):pondOrigin);
  if(pencilMode&&state.view==='eye'){
    const offset=pencilReferenceEye().sub(orbit.target);
    orbit.az=Math.atan2(offset.x,offset.z);
    orbit.elev=Math.atan2(offset.y,Math.hypot(offset.x,offset.z));
    orbit.dist=offset.length();
  }else{
    orbit.az=pencilMode?.23:.27;
    orbit.elev=pencilMode?.095:.30;
    orbit.dist=(pencilMode?6.9:16.2)*Math.max(1,(pencilMode?.94:1.42)/camera.aspect);
  }
  applyOrbit();
}
const flightRings=new T.Group();
const ringEffects=[];
for(let i=0;i<3;i++){
  const mat=new T.MeshBasicMaterial({color:0xa4f2e5,transparent:true,opacity:0,depthWrite:false});
  const fx=ring(flightRings,mat,1,.045,.012);
  fx.renderOrder=10;ringEffects.push(fx);
}
const bubbles=new T.Group();
const bubbleMat=new T.MeshBasicMaterial({color:0xd9faf1,transparent:true,opacity:.61,depthWrite:false});
const bubbleEffects=Array.from({length:9},()=>ball(bubbles,bubbleMat,0,0,0,.038,.038,.038,9));
scene.add(flightRings,bubbles);
function setSpearPose(position,direction) {
  spear.position.copy(position);spear.quaternion.setFromUnitVectors(V(0,1,0),direction);
}
function placeReticle(){
  const g=state.game, el=$('reticle');
  el.hidden=state.mode!=='game'||state.view!=='eye'||!canThrow(g);
  el.classList.toggle('charging',g.charging);
  el.style.setProperty('--charge',(g.charge*100)+'%');
  el.style.left=(g.aim.x+1)*50+'%';el.style.top=(1-g.aim.y)*50+'%';
}
function resize(){
  const width=stage.clientWidth,height=stage.clientHeight;
  camera.aspect=width/Math.max(1,height);
  renderer.setSize(width,height,false);
  pencilTarget.setSize(Math.max(1,Math.round(width*.64)),Math.max(1,Math.round(height*.64)));
  resetCamera();
}
new ResizeObserver(resize).observe(stage);
function aimAt(x,y){
  const g=state.game;
  if(!canThrow(g))return;
  g.aim.set(clamp(x,-.96,.96),clamp(y,-.95,.95));placeReticle();
}
function aimWithPointer(event){
  const b=canvas.getBoundingClientRect();
  aimAt((event.clientX-b.left)/b.width*2-1,1-(event.clientY-b.top)/b.height*2);
}
function aimDirection(){
  const {x,y}=state.game.aim;
  return V(x,y,.35).unproject(camera).sub(observationEye).normalize();
}
function launch(){
  const g=state.game;
  if(state.mode!=='game'||state.view!=='eye'||!canThrow(g))return;
  const start=observationEye.clone(),dir=aimDirection(),speed=8+g.charge*15;
  const waterTime=dir.y<-.001?-start.y/dir.y:Infinity;
  const bottom=dir.y<-.001?(-2.58-start.y)/dir.y:Infinity;
  const maxDistance=Math.min(bottom,9.7);
  const sample=fishPose(g);
  g.last={start,dir,speed,maxDistance,waterTime,traveled:0,elapsed:0,sample,near:Infinity,bias:0,hit:false,end:start.clone()};
  g.throws++;g.phase='flight';g.charging=false;g.charge=0;
  placeReticle();refreshGameHUD();
}
function beginCharge(){
  const g=state.game;
  if(!canThrow(g)||g.charging)return;
  g.charging=true;g.charge=0;placeReticle();
}
function finishShot(hit,point,pose){
  const g=state.game, shot=g.last;
  shot.hit=hit;shot.end.copy(point);
  if(hit){
    shot.sample=pose;g.points=100+(ammo-g.throws)*25+Math.ceil(g.remaining)*2;g.score+=g.points;
    endRound('hit');
  }else{
    g.feedback=shot.bias>.20?'掠过上方 · 试着再瞄低一点':shot.bias<-.22?'掠过下方 · 稍微抬高准星':'偏向一侧 · 试着瞄在游动方向的前方';
    g.phase='recover';g.flash=.76;refreshGameHUD();
  }
}
function advanceShot(dt,pose){
  const shot=state.game.last;
  const from=shot.traveled,to=Math.min(shot.maxDistance,from+dt*shot.speed);
  const start=shot.start.clone().addScaledVector(shot.dir,from);
  const point=shot.start.clone().addScaledVector(shot.dir,to);
  shot.elapsed+=dt;shot.traveled=to;shot.end.copy(point);
  setSpearPose(point,shot.dir);
  const radii=V(.55,.24,.17);
  const rotation=new T.Quaternion().setFromAxisAngle(V(0,1,0),pose.yaw), inverse=rotation.clone().invert();
  const origin=start.clone().sub(pose.position).applyQuaternion(inverse).divide(radii);
  const direction=shot.dir.clone().applyQuaternion(inverse).divide(radii).normalize();
  const bodyHit=new T.Ray(origin,direction).intersectSphere(new T.Sphere(V(),1),V());
  if(bodyHit){
    const contact=bodyHit.multiply(radii).applyQuaternion(rotation).add(pose.position);
    if(contact.distanceToSquared(start)<=(to-from+.025)**2){
      finishShot(true,contact,pose);return;
    }
  }
  const offset=pose.position.clone().sub(start);
  const closest=start.clone().addScaledVector(shot.dir,clamp(offset.dot(shot.dir),0,to-from));
  const distance=closest.distanceToSquared(pose.position);
  if(distance<shot.near){shot.near=distance;shot.sample=pose;shot.bias=closest.y-pose.position.y;}
  if(to>=shot.maxDistance)finishShot(false,point,pose);
}
function animateGame(dt){
  const g=state.game;
  const active=state.mode==='game'&&state.view==='eye';
  spear.visible=active&&['play','flight'].includes(g.phase);
  flightRings.visible=false;bubbles.visible=false;
  if(!active)return;
  updateGameClock(dt);
  const pose=fishPose(g);
  mainFish.position.copy(pose.position);mainFish.rotation.y=pose.yaw;
  if(g.phase==='flight'){
    advanceShot(dt,pose);
  }else if(g.phase==='play'){
    const dir=aimDirection(), up=V(0,1,0).applyQuaternion(camera.quaternion), right=V(1,0,0).applyQuaternion(camera.quaternion);
    const tip=observationEye.clone().addScaledVector(dir,1.95-g.charge*.38).addScaledVector(right,.30).addScaledVector(up,-.24);
    const grip=observationEye.clone().addScaledVector(right,.51).addScaledVector(up,-.45);
    setSpearPose(tip,tip.clone().sub(grip).normalize());
  }
  const shot=g.last;
  if(shot){
    const since=shot.elapsed+(g.phase==='recover'?.76-g.flash:0)-shot.waterTime/shot.speed;
    flightRings.visible=(g.phase==='flight'||g.phase==='recover')&&since>=0&&since<.66;
    if(flightRings.visible){
      flightRings.position.copy(shot.start).addScaledVector(shot.dir,shot.waterTime);flightRings.position.y=0;
      ringEffects.forEach((fx,i)=>{
        const t=Math.max(0,since-i*.075);
        fx.visible=t>0;fx.scale.setScalar(.065+t*(1.35-i*.14));fx.material.opacity=(1-t/.69)*.81;
      });
    }
    bubbles.visible=g.phase==='flight'&&since>0;
    if(bubbles.visible)bubbleEffects.forEach((bubble,i)=>{
      const distance=shot.traveled-i*.17;
      bubble.visible=distance>=shot.waterTime;
      bubble.position.copy(shot.start).addScaledVector(shot.dir,distance);
      bubble.position.z+=Math.sin(i*3.14*.78)*.044;bubble.position.y+=Math.min(.09,i*.013);
    });
  }
  refreshGameHUD();placeReticle();
}
const canvas=renderer.domElement;
const pointers=new Map();
const orbitEnabled=()=>state.view==='side'||state.mode==='pencil';
const gameActive=()=>state.mode==='game'&&state.view==='eye';
function panOrbit(dx,dy){
  const scale=2*orbit.dist*Math.tan(rad(camera.fov*.5))/stage.clientHeight;
  const right=V(1,0,0).applyQuaternion(camera.quaternion),up=V(0,1,0).applyQuaternion(camera.quaternion);
  orbit.target.addScaledVector(right,-dx*scale).addScaledVector(up,dy*scale);
}
function touchSpan(){
  const [a,b]=[...pointers.values()].filter(point=>point.touch);
  return b?Math.hypot(b.x-a.x,b.y-a.y):0;
}
canvas.addEventListener('contextmenu',event=>event.preventDefault());
canvas.addEventListener('pointerdown',event=>{
  if(event.button!==0&&event.button!==2)return;
  if(gameActive()){
    if(event.button!==0||pointers.size||!canThrow(state.game))return;
    aimWithPointer(event);beginCharge();stage.focus({preventScroll:true});
  }
  pointers.set(event.pointerId,{x:event.clientX,y:event.clientY,pan:event.button===2||event.shiftKey,touch:event.pointerType==='touch'});
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove',event=>{
  if(gameActive()){
    if(!pointers.size||pointers.has(event.pointerId))aimWithPointer(event);
    return;
  }
  const point=pointers.get(event.pointerId);
  if(!point||!orbitEnabled())return;
  const dx=event.clientX-point.x,dy=event.clientY-point.y;
  const previousSpan=point.touch?touchSpan():0;
  point.x=event.clientX;point.y=event.clientY;
  if(previousSpan>0){
    const span=touchSpan();
    if(previousSpan>2&&span>2)orbit.dist=clamp(orbit.dist*previousSpan/span,1.55,58);
    panOrbit(dx/2,dy/2);
  }else if(point.pan||event.shiftKey){
    panOrbit(dx,dy);
  }else{
    orbit.az-=dx*.006;orbit.elev=clamp(orbit.elev+dy*.006,-1.2,1.45);
  }
  applyOrbit();
});
canvas.addEventListener('pointerup',event=>{
  if(!pointers.delete(event.pointerId))return;
  if(gameActive()&&event.button===0&&state.game.charging){
    aimWithPointer(event);launch();
  }
});
function cancelPointer(){
  pointers.clear();
  if(!gameActive())return;
  state.game.charging=false;state.game.charge=0;placeReticle();
}
function cancelCanvasPointer(event){
  if(!pointers.delete(event.pointerId)||!gameActive())return;
  cancelPointer();
}
canvas.addEventListener('pointercancel',cancelCanvasPointer);
canvas.addEventListener('lostpointercapture',cancelCanvasPointer);
window.addEventListener('blur',cancelPointer);
canvas.addEventListener('wheel',event=>{
  if(!orbitEnabled())return;
  event.preventDefault();orbit.dist=clamp(orbit.dist*Math.exp(event.deltaY*.001),1.55,58);applyOrbit();
},{passive:false});
stage.addEventListener('keydown',event=>{
  if(!gameActive()||!canThrow(state.game)||event.target instanceof HTMLButtonElement)return;
  const step=event.shiftKey?.052:.027, a=state.game.aim;
  const moves={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,step],ArrowDown:[0,-step]};
  if(moves[event.key]){event.preventDefault();aimAt(a.x+moves[event.key][0],a.y+moves[event.key][1]);}
  if(event.code==='Space'){event.preventDefault();beginCharge();}
});
stage.addEventListener('keyup',event=>{
  if(event.code==='Space'&&gameActive()&&state.game.charging){event.preventDefault();launch();}
});
const tabs=[...document.querySelectorAll('[data-mode]')];
function enterStation(mode){const tab=tabs.find(t=>t.dataset.mode===mode);if(tab)activateMode(tab);}
function toggleReference(){
  const image=$('designReference'), show=image.hidden;
  if(show&&!image.querySelector('img').src)image.querySelector('img').src=image.querySelector('img').dataset.src;
  image.hidden=!show;
  const button=$('referenceToggle');
  if(button){button.textContent=show?'返回三维海岛':'查看设计原图';button.setAttribute('aria-pressed',String(show));}
  $('stationMap').hidden=show;
}
for(const button of $('stationMap').querySelectorAll('[data-enter]'))button.onclick=()=>enterStation(button.dataset.enter);
$('closeReference').onclick=toggleReference;
function renderStationMap(){
  if($('stationMap').hidden)return;
  for(const button of $('stationMap').querySelectorAll('[data-enter]')){
    const p=stationPositions[button.dataset.enter].clone().project(camera);
    button.hidden=p.z<=-1||p.z>=1||Math.abs(p.x)>.88||Math.abs(p.y)>.88;
    if(!button.hidden){button.style.left=(p.x+1)*50+'%';button.style.top=(1-p.y)*50+'%';}
  }
}
function selectTab(mode){
  for(const t of tabs){
    const active=t.dataset.mode===(mode==='fish'?'human':mode);
    t.setAttribute('aria-selected',String(active));t.tabIndex=active?0:-1;
  }
}
function activateMode(tab) {
  if(tab.dataset.mode===state.mode||(tab.dataset.mode==='human'&&pondObservation()))return;
  cancelPointer();
  opticalTransition=null;
  state.index=state.refraction?N:1;
  state.mode=tab.dataset.mode;
  state.view=['game','pencil'].includes(state.mode)?'eye':'side';
  state.rays=false;
  pondRayEye=null;selectTab(state.mode);
  resetCamera();refresh();controls.scrollTop=0;
}
for(const tab of tabs){
  tab.tabIndex=tab.dataset.mode===state.mode?0:-1;
  tab.onclick=()=>activateMode(tab);
  tab.onkeydown=event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    event.preventDefault();
    const i=event.key==='Home'?0:event.key==='End'?tabs.length-1:(tabs.indexOf(tab)+(event.key==='ArrowRight'?1:tabs.length-1))%tabs.length;
    tabs[i].focus();activateMode(tabs[i]);
  };
}

let lastFrame=0,time=0;
function frame(ms) {
  const delta=Math.min(.045,(ms-lastFrame)*.001);
  lastFrame=ms;time+=delta;surfaceUniforms.uTime.value=time;
  if(state.mode!=='pencil')animateFish(state.mode==='game'?(state.view==='side'&&state.game.last?.sample?state.game.last.sample.phase:state.game.swimTime)*5.6:time*5.1);
  animateGame(delta);
  if(opticalTransition){
    const {start,from,to}=opticalTransition;
    const progress=clamp((ms-start)/680,0,1);
    state.index=T.MathUtils.lerp(from,to,progress*progress*(3-2*progress));
    updateOptics();
    if(state.view==='side')updateOverlays();
    if(progress===1)opticalTransition=null;
  }
  renderDiagram();
  if(state.mode==='overview')renderStationMap();
  if(state.mode==='pencil')drawPencil();
  else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
for(const root of [pond,studio]){
  root.traverse(object=>{
    if(!object.isMesh||object.material.transparent||object.material.isShaderMaterial)return;
    object.receiveShadow=true;
    object.castShadow=!mainFish.getObjectById(object.id)&&object!==water;
  });
}
resize();refresh();requestAnimationFrame(frame);

</script>

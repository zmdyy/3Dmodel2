<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>自行车 · 链传动与碟刹机构</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;background:#f3f7f2;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;color:#355d50}.load{padding:25px;border-radius:18px;background:white;box-shadow:0 10px 36px #14281c21}</style></head><body><div class="load" id="load">正在载入 V3.46 高精度模型… <span id="count">0/24</span></div><script>(async()=>{try{const BUILD='20261101-controls-overview-v2';const files=Array.from({length:24},(_,i)=>'bicycle-v346-assets/chunk-'+String(i).padStart(2,'0')+'.txt?v='+BUILD);const chunks=new Array(files.length);let done=0;for(let start=0;start<files.length;start+=4){await Promise.all(files.slice(start,start+4).map(async(url,j)=>{const i=start+j;const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw Error('资源 '+url+' '+r.status);chunks[i]=await r.text();document.getElementById('count').textContent=(++done)+'/24';}));}document.open();document.write(chunks.join(''));document.close();}catch(e){document.getElementById('load').textContent='加载失败：'+e.message+'。请检查网络连接并重新刷新。';console.error(e)}})();</script></body></html>

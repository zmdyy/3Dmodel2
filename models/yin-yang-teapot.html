:root{--paper:#f8f5ec;--ink:#263d34;--green:#285749;--muted:#50685d;--line:#dcded0}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,"Microsoft YaHei","PingFang SC",LessonCJK,sans-serif}
.collection{max-width:1680px;margin:auto;padding:16px clamp(13px,3vw,50px) 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}.seal{width:46px;height:46px;flex:none;display:grid;place-items:center;border:1px solid #ae795e;border-radius:10px;color:#925a41;font:700 22px/1 "SimSun",LessonCJK,serif}.series{color:#915e42;font-size:11px;font-weight:750;letter-spacing:.16em}
h1{margin:0;font:700 clamp(27px,3vw,41px)/1.13 "Songti SC","SimSun",LessonCJK,serif;letter-spacing:.04em}
.tabs{display:flex;gap:4px;padding:4px;background:#edece1;border:1px solid #dedfd0;border-radius:10px;flex:none}
.tab{min-height:36px;border:1px solid transparent;border-radius:7px;background:transparent;color:#3d594d;padding:4px 17px;font:700 14px/1.3 system-ui,"Microsoft YaHei","PingFang SC",LessonCJK,sans-serif;cursor:pointer;white-space:nowrap}

<details><summary>原理与资料</summary><p>水先从进水孔进入短臂。超过弯管顶部后，水灌入较长的出水臂并建立连续水柱。杯内水面高于杯底出口，虹吸便持续。水面降到进水孔，空气进入，虹吸中断，杯底会留一点水。</p><p>青瓷中央柱为教学造型。水位按模型尺寸换算，流速、注水过程和空气箭头用于定性观察。</p><p><a href="https://www.kjah.org/upload/pdf/kjah-310-202106-003.pdf" target="_blank" rel="noreferrer">古代公道杯结构资料</a> · <a href="https://lecturedemos.ph.utexas.edu/demo/294" target="_blank" rel="noreferrer">课堂虹吸演示</a></p></details>

<details><summary>原型与原理</summary><p>参照淄博出土的战国竹节柄铜汲酒器。四节竹节长柄上端封闭，第二节有长方形气孔，荷蕾形腔底的圆孔进出液。模型简化了龙首、装饰和比例，酒坛与接液杯为教学配套。</p><p>开孔浸入时，液体从下孔进入，空气从柄侧排出。封孔提起时，少量液体回流，腔内压强降低，内外压强差与液柱造成的压强差平衡。松手后空气补入，液体重新流出。示踪和微量回流做了视觉放大。</p><p><a href="https://shandong-chorography.org/database/c34/section/8/article/703/" target="_blank" rel="noreferrer">《临淄区志》器物资料</a> · <a href="https://news.iqilu.com/shandong/kejiaoshehui/20240504/5646417.shtml" target="_blank" rel="noreferrer">实物与操作说明</a></p></details>
</section></aside></div></div>
